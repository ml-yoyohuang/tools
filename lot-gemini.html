<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2000萬超級紅包 v1.1.2 Final</title>
    <style>
        :root { --lotto-red: #d20000; --lotto-gold: #ffd700; --lotto-gold-dark: #b8860b; --card-bg: #e63946; }
        body { background-color: #222; font-family: "Microsoft JhengHei", sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card-container { width: 500px; background: var(--card-bg); border: 8px solid var(--lotto-gold); border-radius: 20px; padding: 15px; box-shadow: 0 10px 50px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 12px; }
        .header-box { text-align: center; color: var(--lotto-gold); margin-bottom: 5px; }
        h1 { margin: 0; text-shadow: 2px 2px 0 #000; font-size: 26px; }
        .game-zone { background: #fffbe6; border: 2px solid var(--lotto-gold-dark); border-radius: 8px; color: #333; position: relative; }
        .zone-header { background: var(--lotto-gold-dark); color: white; font-size: 13px; padding: 4px 10px; font-weight: bold; }
        .content-area { position: relative; width: 100%; }
        .scratch-canvas { position: absolute; top: 0; left: 0; cursor: pointer; z-index: 10; touch-action: none; }
        .grid { display: grid; padding: 10px; gap: 5px; }
        .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid #eee; font-weight: bold; font-size: 14px; min-height: 50px; text-align: center;}
        .prize-text { color: var(--lotto-red); font-size: 11px; }
        .symbol-font { font-size: 24px; }
        .table-header { display: grid; grid-template-columns: 1fr 1fr 1.2fr; text-align: center; font-size: 12px; font-weight: bold; padding: 5px 0; background: #ffeaa7; border-bottom: 1px solid var(--lotto-gold-dark); }
        #result-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .result-box { background: white; padding: 40px; border-radius: 30px; border: 5px solid var(--lotto-gold); text-align: center; min-width: 320px; }
        #result-amount { font-size: 55px; color: var(--lotto-red); margin: 20px 0; font-family: 'Arial Black'; }
        .btn-reset { padding: 12px 40px; background: var(--lotto-gold); border: none; border-radius: 50px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 var(--lotto-gold-dark); margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="header-box"><h1>2,000萬超級紅包</h1><div style="font-size:12px">v1.1.2 穩定版</div></div>
        
        <div class="game-zone"><div class="zone-header">1. 三個金額相同即得獎金</div><div class="content-area"><div id="zone1" class="grid" style="grid-template-columns: repeat(3, 1fr);"></div><canvas id="canvas1" class="scratch-canvas"></canvas></div></div>
        <div class="game-zone"><div class="zone-header">2. 您的號碼對中幸運號碼即得獎金</div><div class="content-area"><div id="lucky2" class="grid" style="grid-template-columns: repeat(2, 1fr); background: #eee;"></div><div id="zone2" class="grid" style="grid-template-columns: repeat(5, 1fr);"></div><canvas id="canvas2" class="scratch-canvas"></canvas></div></div>
        <div style="display: flex; gap: 10px;">
            <div class="game-zone" style="flex:1"><div class="zone-header">3. 刮出即得</div><div class="content-area"><div id="zone3" class="cell"></div><canvas id="canvas3" class="scratch-canvas"></canvas></div></div>
            <div class="game-zone" style="flex:1"><div class="zone-header">4. 刮出即得</div><div class="content-area"><div id="zone8" class="cell"></div><canvas id="canvas8" class="scratch-canvas"></canvas></div></div>
        </div>
        <div style="display: flex; gap: 10px;">
            <div class="game-zone" style="flex:1"><div class="zone-header">5. 三個相同金額</div><div class="content-area"><div id="zone4" class="grid" style="grid-template-columns: repeat(3, 1fr);"></div><canvas id="canvas4" class="scratch-canvas"></canvas></div></div>
            <div class="game-zone" style="flex:1"><div class="zone-header">6. 兩個相同金額</div><div class="content-area"><div id="zone6" class="grid" style="grid-template-columns: repeat(2, 1fr);"></div><canvas id="canvas6" class="scratch-canvas"></canvas></div></div>
        </div>
        <div class="game-zone"><div class="zone-header">7. 您 > 對手 = 得獎金</div><div class="table-header"><div>您</div><div>對手</div><div>獎金</div></div><div class="content-area"><div id="zone5" class="grid" style="grid-template-columns: 1fr 1fr 1.2fr; padding:0;"></div><canvas id="canvas5" class="scratch-canvas"></canvas></div></div>
        <div class="game-zone"><div class="zone-header">8. 您的符號對中幸運符號即得獎金</div><div class="content-area"><div id="lucky7" class="grid" style="grid-template-columns: repeat(2, 1fr); background: #eee;"></div><div id="zone7" class="grid" style="grid-template-columns: repeat(6, 1fr);"></div><canvas id="canvas7" class="scratch-canvas"></canvas></div></div>
    </div>

    <button class="btn-reset" onclick="location.reload()">再買一張 (1,000元)</button>

    <div id="result-overlay"><div class="result-box"><h2 id="result-title">結算中...</h2><div id="result-amount">$0</div><button class="btn-reset" onclick="location.reload()">確定</button></div></div>

<script>
    const SYMBOLS = ['🧧', '💎', '💰', '🦁', '🏮', '🐲', '👑', '🍊', '🍍', '🔔', '🥇', '🐎'];
    const REAL_PRIZES = [500, 1000, 2000, 5000];
    const HIGH_PRIZES = [10000, 100000, 1000000, 20000000]; // 假獎金排除 REAL_PRIZES 以防計算衝突
    let scratchedZones = new Set();

    function getRandomPrize() { return REAL_PRIZES[Math.floor(Math.random()*REAL_PRIZES.length)]; }
    function getRandomFake() { return HIGH_PRIZES[Math.floor(Math.random()*HIGH_PRIZES.length)]; }

    // 洗牌演算法
    function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

    function initGame() {
        const winConfig = Array.from({length: 8}, () => Math.random() < 0.2);
        renderZone1_4(1, winConfig[0]);
        renderZone2(winConfig[1]);
        renderZoneSingle(3, winConfig[2], 3);
        renderZone1_4(4, winConfig[3]);
        renderZone5(winConfig[4]);
        renderZone6(winConfig[5]);
        renderZone7(winConfig[6]);
        renderZoneSingle(8, winConfig[7], 8);
        document.querySelectorAll('.scratch-canvas').forEach((canvas, idx) => setupScratch(canvas, idx));
    }

    // 區域 1 & 4：三個相同。data-val 分配：僅首個匹配項帶值。
    function renderZone1_4(id, isWin) {
        const el = document.getElementById('zone'+id);
        const limit = (id === 4) ? 3 : 6;
        const winAmt = getRandomPrize();
        let items = [];
        if (isWin) {
            items = [winAmt, winAmt, winAmt];
            let fakes = shuffle([...HIGH_PRIZES]);
            while(items.length < limit) items.push(fakes.pop());
        } else {
            let pool = []; 
            [...HIGH_PRIZES, 100, 200, 300].filter(v => v !== winAmt).forEach(v => pool.push(v, v));
            items = shuffle(pool).slice(0, limit);
        }
        
        shuffle(items);
        let winFound = false;
        el.innerHTML = items.map(a => {
            let val = 0;
            if (isWin && a === winAmt && !winFound) { val = winAmt; winFound = true; }
            return `<div class="cell lotto-item" data-val="${val}">$${a.toLocaleString()}</div>`;
        }).join('');
    }

    // 區域 2：隨機幸運數字。data-val 分配：中獎格帶全額。
    function renderZone2(isWin) {
        let lucky = [];
        while(lucky.length < 2) {
            let n = Math.floor(Math.random() * 99) + 1;
            if(!lucky.includes(n)) lucky.push(n);
        }
        document.getElementById('lucky2').innerHTML = lucky.map(n => `<div class="cell">幸運: ${n.toString().padStart(2, '0')}</div>`).join('');
        
        const winAmt = getRandomPrize();
        const winIdx = isWin ? Math.floor(Math.random() * 10) : -1;
        let html = '';
        for(let i=0; i<10; i++) {
            const hit = (i === winIdx);
            let num;
            if(hit) num = lucky[0];
            else { do { num = Math.floor(Math.random() * 99) + 1; } while(lucky.includes(num)); }
            const p = hit ? winAmt : getRandomFake();
            html += `<div class="cell lotto-item" data-val="${hit ? winAmt : 0}"><span>${num.toString().padStart(2, '0')}</span><span class="prize-text">$${p.toLocaleString()}</span></div>`;
        }
        document.getElementById('zone2').innerHTML = html;
    }

    // 區域 5：比大小。data-val 分配：僅「您」格帶獎金。
    function renderZone5(isWin) {
        const el = document.getElementById('zone5');
        const winAmt = getRandomPrize();
        const winRow = isWin ? Math.floor(Math.random() * 4) : -1;
        let html = '';
        for(let i=0; i<4; i++) {
            const hit = (i === winRow);
            const p = hit ? winAmt : getRandomFake();
            let my = hit ? 90 + i : 10 + i;
            let opp = hit ? 20 + i : 80 + i;
            html += `<div class="cell lotto-item" data-val="${hit ? winAmt : 0}">${my}</div><div class="cell" data-val="0">${opp}</div><div class="cell prize-text" data-val="0">$${p.toLocaleString()}</div>`;
        }
        el.innerHTML = html;
    }

    // 區域 6：兩個相同。data-val 分配：僅首格帶值。
    function renderZone6(isWin) {
        const winAmt = getRandomPrize();
        const items = isWin ? [winAmt, winAmt] : [getRandomFake(), 100];
        el6 = document.getElementById('zone6');
        let winFound = false;
        el6.innerHTML = items.map(a => {
            let val = 0;
            if (isWin && a === winAmt && !winFound) { val = winAmt; winFound = true; }
            return `<div class="cell lotto-item" data-val="${val}">$${a.toLocaleString()}</div>`;
        }).join('');
    }

    // 區域 7：符號。data-val 分配：中獎格帶值。
    function renderZone7(isWin) {
        let pool = shuffle([...SYMBOLS]);
        const lucky = [pool[0], pool[1]];
        document.getElementById('lucky7').innerHTML = lucky.map(s => `<div class="cell">幸運: ${s}</div>`).join('');
        const winAmt = getRandomPrize();
        const winIdx = isWin ? Math.floor(Math.random() * 6) : -1;
        let html = '';
        for(let i=0; i<6; i++) {
            const hit = (i === winIdx);
            const p = hit ? winAmt : getRandomFake();
            html += `<div class="cell lotto-item" data-val="${hit ? winAmt : 0}"><span class="symbol-font">${hit ? lucky[0] : pool[i+2]}</span><span class="prize-text">$${p.toLocaleString()}</span></div>`;
        }
        document.getElementById('zone7').innerHTML = html;
    }

    // 區域 3 & 8：刮出即得。data-val 分配：直接帶值。
    function renderZoneSingle(id, isWin) {
        const p = isWin ? getRandomPrize() : 0;
        document.getElementById('zone'+id).innerHTML = `<div class="lotto-item" data-val="${p}"><span>$${p.toLocaleString()}</span><br><span class="prize-text">獎金</span></div>`;
    }

    function setupScratch(canvas, idx) {
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.parentElement.offsetWidth;
        canvas.height = canvas.parentElement.offsetHeight;
        ctx.fillStyle = '#C0C0C0'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        let active = false;
        const scratch = (e) => {
            if(!active) return;
            const rect = canvas.getBoundingClientRect();
            const cx = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
            const cy = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath(); ctx.arc(cx, cy, 25, 0, Math.PI*2); ctx.fill();
        };
        canvas.onmousedown = canvas.ontouchstart = (e) => { active = true; scratch(e); };
        window.addEventListener('mousemove', scratch);
        window.addEventListener('touchmove', scratch);
        window.addEventListener('mouseup', () => { if(active){ active=false; scratchedZones.add(idx); if(scratchedZones.size===8) showFinalResult(); } });
    }

    function showFinalResult() {
        let total = 0;
        document.querySelectorAll('.lotto-item').forEach(el => { total += parseInt(el.getAttribute('data-val') || 0); });
        setTimeout(() => {
            const overlay = document.getElementById('result-overlay');
            const amountEl = document.getElementById('result-amount');
            overlay.style.display = 'flex';
            let start = null;
            const step = (ts) => {
                if(!start) start = ts;
                const prog = Math.min((ts - start) / 2000, 1);
                amountEl.innerText = `$${Math.floor(prog * total).toLocaleString()}`;
                if(prog < 1) window.requestAnimationFrame(step);
                else document.getElementById('result-title').innerText = total > 0 ? "恭喜中獎！" : "再接再厲";
            };
            window.requestAnimationFrame(step);
        }, 500);
    }
    window.onload = initGame;
</script>
</body>
</html>
