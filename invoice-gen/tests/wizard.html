<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wizard QA</title><style>body{font:14px system-ui;margin:20px}button{padding:12px}pre{white-space:pre-wrap;max-height:250px;overflow:auto;line-height:1.6}iframe{width:390px;max-width:100%;height:844px;border:1px solid #ddd}</style><h1>簡易製作驗收</h1><button id="run" disabled>執行</button><pre id="log">載入中</pre><iframe id="app" title="簡易製作測試" src="../wizard.html"></iframe><script>
const frame=document.getElementById('app'),log=document.getElementById('log'),run=document.getElementById('run');frame.onload=()=>{run.disabled=false;log.textContent='準備完成';};
let count=0;
function check(value,name){if(!value)throw Error(name);count++;log.textContent+='✓ '+name+'\n';}
const wait=async(fn)=>{const start=performance.now();while(!fn()){if(performance.now()-start>10000)throw Error('等待逾時');await new Promise(r=>setTimeout(r,40));}};
const tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
run.onclick=async()=>{run.disabled=true;log.textContent='';count=0;try{
 const w=frame.contentWindow,d=w.document,$=id=>d.getElementById(id),click=s=>d.querySelector(s).click(),input=(id,value,event='input')=>{$(id).value=value;$(id).dispatchEvent(new w.Event(event,{bubbles:true}));},visibleTools=()=>[...d.querySelectorAll('[data-panel]')].filter(el=>!el.hidden).map(el=>el.dataset.panel).join(',');
 check($('workspace').hidden,'第一步只顯示載具表單');check($('continue').disabled,'空白不能繼續');input('carrier','/ABC_123');check($('continue').disabled,'拒絕不合法載具');input('carrier','abc+123');check($('carrier').value==='/ABC+123','自動整理載具格式');$('continue').click();await tick();
 check(d.body.dataset.step==='2','第二步選擇版型與形狀');check(visibleTools()==='layout,size','版型與尺寸按鈕並排顯示');check(!$('sheet').open,'不自動展開多餘表單');click('[data-panel="layout"]');check($('sheet').open,'圖示開啟底部浮層');click('[data-layout="side"]');check(!$('sheet').open,'選擇版型後自動收合');await tick();
 check(d.body.dataset.step==='2'&&visibleTools()==='layout,size','同一步即可開啟尺寸工具');click('[data-panel="size"]');click('[data-size="custom"]');input('ratio-w','4');input('ratio-h','3');$('resize-canvas').click();await tick();check(!$('handles').hidden,'自訂比例可在畫布拖拉');const ratio=$('canvas').width/$('canvas').height;check(Math.abs(ratio-4/3)<.005,'自訂比例套用');$('next').click();await tick();
 check(d.body.dataset.step==='3'&&visibleTools()==='image,adjust','第三步顯示圖片與調整工具');check($('handles').hidden,'離開比例步驟收起控制點');check($('next').disabled,'未選圖前不能完成');click('[data-panel="image"]');check(!$('upload-panel').hidden&&$('gallery').hidden,'圖片預設自選相簿');click('[data-source="gallery"]');check(d.querySelectorAll('[data-image]').length===6,'六款內建 SVG 占位圖');click('[data-image="garden"]');await wait(()=>!$('next').disabled);check(!$('sheet').open,'選圖後回到全畫布');
 click('[data-panel="adjust"]');const palette=[...d.querySelectorAll('[data-color]')].map(el=>el.dataset.color);check(palette.includes('#2446ff')&&palette.includes('#ff1688')&&palette.includes('#dfff00'),'鮮明高彩預設色');check(!palette.includes('#e9e2d1'),'沒有原本的莫蘭迪色票');click('[data-color="#ff1688"]');$('close-sheet').click();$('back').click();await tick();check(d.body.dataset.step==='2','可以返回版型與形狀步驟');click('[data-panel="size"]');click('[data-size="portrait"]');$('next').click();await tick();check(!$('next').disabled,'返回保留已選圖片');$('next').click();await wait(()=>$('sheet').open&&$('result').getAttribute('src'));await $('result').decode();
 check($('result').naturalWidth===1595&&$('result').naturalHeight===2540,'印刷 JPG 超過 400 萬畫素');const blob=await (await fetch($('download').href)).blob();check(blob.type==='image/jpeg','印刷檔使用 JPG');const b=new Uint8Array(await blob.arrayBuffer());let jfif=-1;for(let i=2;i<64;i++)if(b[i]===255&&b[i+1]===224&&b[i+4]===74&&b[i+5]===70){jfif=i;break;}check(jfif>=0&&b[jfif+11]===1&&((b[jfif+12]<<8)|b[jfif+13])===750&&((b[jfif+14]<<8)|b[jfif+15])===750,'實際 JPG metadata 為 750 dpi');
 $('close-sheet').click();$('back').click();click('[data-panel="size"]');click('[data-size="square"]');$('next').click();$('next').click();await wait(()=>$('sheet').open&&$('result').naturalWidth===1800);await $('result').decode();const png=await (await fetch($('download').href)).blob();check(png.type==='image/png'&&$('result').naturalHeight===1800,'一般圖片輸出正方形 PNG');$('close-sheet').click();
 click('[data-panel="image"]');click('[data-source="upload"]');const source=d.createElement('canvas');source.width=600;source.height=400;source.getContext('2d').fillRect(0,0,600,400);const photo=await new Promise(r=>source.toBlob(r));const transfer=new w.DataTransfer();transfer.items.add(new w.File([photo],'photo.png',{type:'image/png'}));$('file').files=transfer.files;$('file').dispatchEvent(new w.Event('change'));await wait(()=>!$('sheet').open);check(!$('next').disabled,'支援本機照片讀取');
 for(const width of [320,390,768]){frame.style.width=width+'px';await tick();check(d.documentElement.scrollWidth<=d.documentElement.clientWidth+1,'寬度 '+width+' 無橫向溢出');}
 log.textContent+='\nPASS '+count+' 項檢查。實體手機手勢與相簿分享仍需實機確認。';
}catch(e){log.textContent+='\nFAIL '+e.message;}finally{run.disabled=false;}};
</script></html>
