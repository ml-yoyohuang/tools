<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BPM 量測器 (Tap Tempo & Metronome)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --primary-color: #10b981;
            --primary-hover: #34d399;
            --primary-active: #059669;
            --play-color: #3b82f6;
            --play-hover: #60a5fa;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            position: relative;
        }

        /* 右上角音效控制模組 */
        .sound-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 50;
        }

        .sound-select {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            appearance: none; 
            -webkit-appearance: none; 
            background-image: url('data:image/svg+xml;utf8,<svg fill="%2394a3b8" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 18px;
            padding: 8px 32px 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .sound-select:hover { border-color: #475569; }

        .sound-toggle {
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
            user-select: none;
        }
        .sound-toggle:hover { background: #334155; color: white; }
        .sound-toggle.on { color: var(--primary-color); border-color: var(--primary-color); }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* BPM 顯示區 */
        .bpm-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 140px;
            margin-bottom: 20px;
            position: relative;
        }

        .bpm-value {
            font-size: 100px;
            font-weight: 900;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
            transition: transform 0.05s ease-out, border-color 0.2s;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-color);
            text-align: center;
            width: 250px;
            outline: none;
            font-family: inherit;
        }

        /* 隱藏 Input Number 的上下箭頭 */
        .bpm-value::-webkit-outer-spin-button,
        .bpm-value::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .bpm-value { -moz-appearance: textfield; }

        /* 唯讀狀態時，滑鼠游標不顯示可輸入的 I 游標 */
        .bpm-value[readonly] { cursor: default; }
        /* 只有在非唯讀(AUTO開啟)時，點擊才會有底線提示 */
        .bpm-value:not([readonly]):focus { border-bottom: 2px solid var(--primary-color); }
        .bpm-value::placeholder { color: #334155; }
        .bpm-value.pulse { transform: scale(1.1); color: var(--primary-color); }

        .bpm-label {
            font-size: 20px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 4px;
            margin-top: 10px;
        }

        /* 大按鈕區塊 */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 20;
        }

        #tap-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: var(--primary-color);
            border: none;
            color: #022c22;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4), inset 0 4px 6px rgba(255, 255, 255, 0.3);
            transition: all 0.1s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #tap-btn:active, #tap-btn.active-state {
            background: var(--primary-active);
            transform: scale(0.95);
            box-shadow: 0 0px 10px rgba(16, 185, 129, 0.6), inset 0 10px 15px rgba(0, 0, 0, 0.2);
        }

        /* AUTO 播放按鈕 */
        #play-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 2px solid #334155;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 140px;
            justify-content: center;
            letter-spacing: 2px;
            user-select: none;
        }

        #play-btn:hover { background: #334155; color: white; }
        
        #play-btn.playing {
            background: var(--play-color);
            border-color: var(--play-color);
            color: white;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }
        #play-btn.playing:hover { background: var(--play-hover); }

        /* 時間軸設計 */
        .timeline-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 100px;
            margin: 30px 0;
            overflow: hidden;
            -webkit-mask-image: linear-gradient(to right, transparent, black 20%, black 80%, transparent);
            mask-image: linear-gradient(to right, transparent, black 20%, black 80%, transparent);
        }

        .timeline-track {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background-image: linear-gradient(to right, #475569 50%, transparent 50%);
            background-size: 30px 2px;
            animation: scrollTrack 0.15s linear infinite; 
        }

        @keyframes scrollTrack { from { background-position: 0 0; } to { background-position: -30px 0; } }

        .hit-target {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 10;
            transition: all 0.05s ease-out;
        }

        .hit-target.active {
            border-color: var(--primary-color);
            transform: translate(-50%, -50%) scale(1.15);
            background: rgba(16, 185, 129, 0.2);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
        }

        .note {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary-color);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
            transform: translate(-50%, -50%);
            z-index: 5;
            animation: moveNote 5s linear forwards;
        }

        @keyframes moveNote { to { transform: translate(calc(-50% - 1000px), -50%); } }

        .hint { color: #64748b; font-size: 14px; margin-top: 10px; }
        .hint kbd { background: #1e293b; padding: 4px 8px; border-radius: 4px; border: 1px solid #334155; font-family: monospace; color: #cbd5e1; }
        #edit-hint { font-size: 12px; opacity: 0.7; line-height: 1.6; display: block; margin-top: 12px; }

        /* === 手機版響應式設計 (RWD) === */
        @media (max-width: 600px), (max-height: 750px) {
            /* 1. 縮小 BPM 顯示區與文字 */
            .bpm-display {
                height: 100px;
                margin-bottom: 10px;
            }
            .bpm-value {
                font-size: 80px;
                width: 100%;
            }
            .bpm-label {
                font-size: 16px;
                margin-top: 0px;
            }
            
            /* 2. 縮小控制區按鈕 */
            .controls {
                gap: 15px;
            }
            #tap-btn {
                width: 130px;
                height: 130px;
                font-size: 24px;
                margin-top: 20px;
            }
            #play-btn {
                width: 120px;
                padding: 10px 20px;
                font-size: 14px;
            }
            
            /* 3. 壓縮時間軸與提示文字的間距 */
            .timeline-container {
                height: 70px;
                margin: 20px 0;
            }
            .hint {
                font-size: 12px;
                margin-top: 5px;
            }
            
            /* 4. 微調右上角選單 */
            .sound-controls {
                top: 15px;
                right: 15px;
            }
        }

    </style>
</head>
<body>

    <div class="sound-controls">
        <select id="sound-select" class="sound-select">
            <option value="wood">🪵木魚</option>
            <option value="8bit">👾8-Bit</option>
            <option value="kick">🥁大鼓</option>
            <option value="laser">🔫雷射</option>
        </select>
        <button id="sound-toggle" class="sound-toggle on">
            <span id="sound-icon">🔊</span>
        </button>
    </div>

    <div class="container">
        <div class="bpm-display">
            <!-- 預設加上 readonly，防止平常誤觸鍵盤 -->
            <input type="number" id="bpm-value" class="bpm-value" placeholder="---" min="1" max="999" readonly>
            <div class="bpm-label">BPM</div>
        </div>

        <div class="controls">
            <button id="tap-btn">TAP</button>
            <button id="play-btn"><span>▶️</span> AUTO</button>
        </div>

        <div class="timeline-container">
            <div class="timeline-track"></div>
            <div id="hit-target" class="hit-target"></div>
        </div>

        <div class="hint">
            點擊按鈕，或使用 <kbd>空白鍵</kbd> 跟隨節奏敲擊<br>
            <!-- 提示文字同步更新 -->
            <span id="edit-hint">（開啟 AUTO 模式後可點擊數字修改速度）</span>
        </div>
    </div>

    <script>
        const bpmValue = document.getElementById('bpm-value');
        const tapBtn = document.getElementById('tap-btn');
        const playBtn = document.getElementById('play-btn');
        const hitTarget = document.getElementById('hit-target');
        const timelineContainer = document.querySelector('.timeline-container');
        const soundToggle = document.getElementById('sound-toggle');
        const soundSelect = document.getElementById('sound-select');
        const editHint = document.getElementById('edit-hint');
        
        let tapTimes = [];
        let resetTimeout;
        let isSoundEnabled = true;
        
        let currentBPM = 120;
        let isPlaying = false;
        let metronomeTimer = null;

        /* === Web Audio API === */
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTickSound() {
            if (!isSoundEnabled) return;
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            const now = audioCtx.currentTime;
            const soundType = soundSelect.value;

            if (soundType === 'wood') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.05);
                gainNode.gain.setValueAtTime(1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (soundType === '8bit') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, now);
                gainNode.gain.setValueAtTime(0.15, now); 
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (soundType === 'kick') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.15);
                gainNode.gain.setValueAtTime(1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (soundType === 'laser') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(900, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
        }

        /* === 視覺回饋 === */
        function triggerVisuals() {
            bpmValue.classList.remove('pulse');
            void bpmValue.offsetWidth; 
            bpmValue.classList.add('pulse');

            hitTarget.classList.remove('active');
            void hitTarget.offsetWidth;
            hitTarget.classList.add('active');

            clearTimeout(resetTimeout);
            resetTimeout = setTimeout(() => {
                bpmValue.classList.remove('pulse');
                hitTarget.classList.remove('active');
                tapBtn.classList.remove('active-state');
            }, 100);

            spawnNote();
        }

        function spawnNote() {
            const note = document.createElement('div');
            note.className = 'note';
            timelineContainer.appendChild(note);
            setTimeout(() => { if (note.parentElement) note.remove(); }, 5000);
        }

        /* === AUTO 播放邏輯 === */
        function playBeat() {
            if (!isPlaying) return;
            playTickSound();
            triggerVisuals();
            metronomeTimer = setTimeout(playBeat, 60000 / currentBPM);
        }

        playBtn.addEventListener('click', () => {
            initAudio(); 
            isPlaying = !isPlaying;

            if (isPlaying) {
                // 開始播放：解鎖大數字的唯讀狀態
                playBtn.classList.add('playing');
                playBtn.innerHTML = `<span>⏹</span> STOP`;
                bpmValue.removeAttribute('readonly'); // 開放手寫輸入
                editHint.style.color = 'var(--primary-color)';
                
                if (!bpmValue.value) {
                    bpmValue.value = currentBPM;
                } else {
                    currentBPM = parseInt(bpmValue.value);
                }
                playBeat();
            } else {
                // 停止播放：鎖回唯讀狀態
                playBtn.classList.remove('playing');
                playBtn.innerHTML = `<span>▶️</span> AUTO`;
                bpmValue.setAttribute('readonly', 'true'); // 關閉手寫輸入
                bpmValue.blur(); // 自動收起手機鍵盤
                editHint.style.color = '';
                clearTimeout(metronomeTimer);
            }
        });

        /* === 手動輸入 BPM 邏輯 === */
        bpmValue.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            if (!isNaN(val) && val > 0) {
                currentBPM = val;
                tapTimes = []; 
                if (isPlaying) {
                    clearTimeout(metronomeTimer);
                    metronomeTimer = setTimeout(playBeat, 60000 / currentBPM);
                }
            }
        });

        bpmValue.addEventListener('blur', (e) => {
            if (!e.target.value || isNaN(parseInt(e.target.value))) {
                e.target.value = currentBPM;
            }
        });

        /* === 手動 TAP 邏輯 === */
        function handleTap(e) {
            if (e) e.preventDefault();
            const currentTime = performance.now();

            playTickSound();
            tapBtn.classList.add('active-state');
            triggerVisuals();

            if (tapTimes.length > 0 && (currentTime - tapTimes[tapTimes.length - 1]) > 2000) {
                tapTimes = [];
            }
            tapTimes.push(currentTime);

            if (tapTimes.length > 5) tapTimes.shift();

            if (tapTimes.length >= 2) {
                const totalDuration = tapTimes[tapTimes.length - 1] - tapTimes[0];
                const averageInterval = totalDuration / (tapTimes.length - 1);
                currentBPM = Math.round(60000 / averageInterval);
                
                bpmValue.value = currentBPM;
                
                if (isPlaying) {
                    clearTimeout(metronomeTimer);
                    metronomeTimer = setTimeout(playBeat, 60000 / currentBPM);
                }
            }
        }

        /* === 事件綁定 === */
        soundToggle.addEventListener('click', () => {
            isSoundEnabled = !isSoundEnabled;
            if (isSoundEnabled) {
                soundToggle.classList.add('on');
                soundToggle.innerHTML = `<span>🔊</span>`;
                initAudio();
            } else {
                soundToggle.classList.remove('on');
                soundToggle.innerHTML = `<span>🔇</span>`;
            }
        });

        soundSelect.addEventListener('change', initAudio);
        tapBtn.addEventListener('pointerdown', handleTap);

        document.addEventListener('keydown', (e) => {
            if (document.activeElement === bpmValue) return;

            if (e.code === 'Space' && !e.repeat) {
                e.preventDefault();
                handleTap();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'Space' && document.activeElement !== bpmValue) {
                tapBtn.classList.remove('active-state');
            }
        });
    </script>
</body>
</html>
