<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a9bb0"/>
      <stop offset="1" stop-color="#155f6e"/>
    </linearGradient>
    <radialGradient id="cap" cx=".38" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f1e9dc"/>
      <stop offset="1" stop-color="#c9b9a0"/>
    </radialGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#ddd0bb"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2b57a"/>
      <stop offset="1" stop-color="#b9864b"/>
    </linearGradient>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
  <rect width="64" height="64" fill="url(#bg)"/>
  <!-- 料理台（透視） -->
  <path d="M6 64 L16 44 H48 L58 64 Z" fill="url(#board)"/>
  <!-- 腳下的目標光圈 -->
  <ellipse cx="32" cy="50" rx="15" ry="4.2" fill="none" stroke="#ffd84d" stroke-width="2.4"/>
  <!-- 菇柄與臉 -->
  <path d="M24 33 C23 40 23.5 46 25 50 H39 C40.5 46 41 40 40 33 Z" fill="url(#stem)"/>
  <circle cx="28.3" cy="40" r="2.4" fill="#1d1a1a"/>
  <circle cx="35.7" cy="40" r="2.4" fill="#1d1a1a"/>
  <circle cx="29" cy="39.2" r=".8" fill="#fff"/>
  <circle cx="36.4" cy="39.2" r=".8" fill="#fff"/>
  <path d="M30 44.2 Q32 46.2 34 44.2" fill="none" stroke="#1d1a1a" stroke-width="1.4" stroke-linecap="round"/>
  <!-- 菇傘 -->
  <path d="M9 34 C9 18 20 10 32 10 C44 10 55 18 55 34 C46 36.5 18 36.5 9 34 Z" fill="url(#cap)"/>
  <circle cx="22" cy="21" r="3" fill="#fff" opacity=".9"/>
  <circle cx="38" cy="17" r="2.2" fill="#fff" opacity=".9"/>
  <circle cx="45" cy="25" r="2.6" fill="#fff" opacity=".9"/>
  <!-- 湯杓砲射出的湯滴 -->
  <circle cx="54" cy="47" r="3.2" fill="#f7a43a" stroke="#fff3c4" stroke-width="1.2"/>
  <path d="M52 49 L46 52" stroke="#fff3c4" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
  </g>
</svg>
