<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搶票練習器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080808;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      user-select: none;
      touch-action: manipulation;
    }

    .nav-back {
      position: fixed;
      top: 20px;
      left: 24px;
      text-decoration: none;
      color: #888;
      font-size: 13px;
      font-weight: 600;
      transition: color 0.2s;
      z-index: 10;
    }
    .nav-back:hover { color: #aaa; }

    /* 主時間 */
    .time-main {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: clamp(72px, 18vw, 200px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #fff;
      text-align: center;
    }

    .time-main .colon {
      color: #888;
      animation: blink 1s step-start infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    .time-ms {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: clamp(24px, 5vw, 56px);
      font-weight: 400;
      color: #888;
      text-align: center;
      margin-top: 8px;
      letter-spacing: 0.05em;
    }

    .time-ms .ms-val {
      color: #888;
      min-width: 3ch;
      display: inline-block;
    }

    /* 色塊列 */
    .blocks-wrap {
      margin-top: clamp(24px, 5vw, 48px);
      width: 100%;
      max-width: 900px;
    }

    .blocks-label {
      display: flex;
      justify-content: space-between;
      padding: 0 2px;
      margin-bottom: 10px;
    }

    .block-label-item {
      flex: 1;
      text-align: center;
      font-size: clamp(11px, 1.8vw, 16px);
      font-weight: 700;
      color: #333;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .blocks {
      display: flex;
      gap: clamp(4px, 1vw, 10px);
      height: clamp(60px, 12vw, 120px);
    }

    .block {
      flex: 1;
      border-radius: 8px;
      border: 2px solid #1a1a1a;
      background: #111;
      transition: background 0.05s, border-color 0.05s, box-shadow 0.05s;
    }

    .block.past {
      background: #0d2b1a;
      border-color: #1a4a2e;
    }

    .block.active {
      background: #00ff88;
      border-color: #00ff88;
      box-shadow: 0 0 24px #00ff8866, 0 0 60px #00ff8833;
    }

    .block.active.warn {
      background: #ffaa00;
      border-color: #ffaa00;
      box-shadow: 0 0 24px #ffaa0066, 0 0 60px #ffaa0033;
    }

    .block.past.warn-past {
      background: #2b1e00;
      border-color: #4a3300;
    }

    @keyframes tick-flash {
      0%   { background: #ffffff; box-shadow: 0 0 60px #fff, 0 0 120px #fff8; }
      100% { background: #00ff88; box-shadow: 0 0 24px #00ff8866, 0 0 60px #00ff8833; }
    }

    .block.flash {
      animation: tick-flash 0.15s ease-out forwards;
    }

    /* 進度條 */
    .progress-wrap {
      margin-top: clamp(16px, 3vw, 28px);
      width: 100%;
      max-width: 900px;
    }

    .progress-bar-bg {
      height: 6px;
      background: #1a1a1a;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00ff88, #ffaa00);
      border-radius: 99px;
    }

    /* 提示文字 */
    .hint {
      margin-top: clamp(24px, 4vw, 40px);
      font-size: clamp(13px, 2vw, 16px);
      color: #888;
      letter-spacing: 0.05em;
    }

    /* 記錄列表 */
    .log-wrap {
      margin-top: 20px;
      width: 100%;
      max-width: 900px;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .log-title {
      font-size: 12px;
      font-weight: 700;
      color: #888;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .btn-clear {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      background: none;
      border: 1px solid #888;
      border-radius: 4px;
      padding: 3px 10px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .btn-clear:hover { color: #ccc; border-color: #ccc; }

    .btn-export {
      position: fixed;
      bottom: 28px;
      right: 28px;
      padding: 12px 22px;
      background: #1a1a1a;
      color: #aaa;
      border: 1.5px solid #2a2a2a;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      z-index: 10;
    }
    .btn-export:hover { background: #222; color: #fff; border-color: #888; }
    .btn-export.copied { background: #0a1f14; color: #00ff88; border-color: #00ff8844; }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 260px;
      overflow-y: auto;
    }

    .log-item {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 10px 16px;
      background: #111;
      border-radius: 8px;
      border: 1px solid #1a1a1a;
      animation: log-in 0.15s ease-out;
    }

    @keyframes log-in {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .log-item:first-child {
      border-color: #00ff8844;
      background: #0a1f14;
    }

    .log-index {
      font-size: 11px;
      color: #333;
      font-family: 'SF Mono', monospace;
      min-width: 2ch;
      text-align: right;
    }

    .log-time {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: clamp(18px, 3.5vw, 28px);
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.02em;
    }

    .log-time .log-ms {
      color: #00ff88;
      font-size: 0.85em;
    }

    .log-item:first-child .log-time .log-ms {
      text-shadow: 0 0 12px #00ff8888;
    }
  </style>
</head>
<body>
  <a href="index.html" class="nav-back">← 返回首頁</a>

  <div class="time-main">
    <span id="hh">00</span><span class="colon">:</span><span id="mm">00</span><span class="colon">:</span><span id="ss">00</span>
  </div>

  <div class="time-ms">
    .<span class="ms-val" id="ms">000</span>
  </div>

  <div class="blocks-wrap">
    <div class="blocks-label" id="blocks-label"></div>
    <div class="blocks" id="blocks"></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <div class="hint">按下 Enter 或點擊畫面記錄當下時間</div>

  <button class="btn-export" id="btn-export">匯出記錄</button>

  <div class="log-wrap">
    <div class="log-header">
      <div class="log-title">按下記錄</div>
      <button class="btn-clear" id="btn-clear">清除</button>
    </div>
    <div class="log-list" id="log-list"></div>
  </div>

  <script>
    const hhEl     = document.getElementById('hh')
    const mmEl     = document.getElementById('mm')
    const ssEl     = document.getElementById('ss')
    const msEl     = document.getElementById('ms')
    const blocksEl = document.getElementById('blocks')
    const labelsEl = document.getElementById('blocks-label')
    const fillEl   = document.getElementById('progress-fill')
    const logList  = document.getElementById('log-list')

    const TOTAL = 10
    const blocks = []
    let prevSec = -1
    let logCount = 0
    let timeOffset = 0

    for (let i = 0; i < TOTAL; i++) {
      const label = document.createElement('div')
      label.className = 'block-label-item'
      label.textContent = '.' + ((i + 1) % 10)
      labelsEl.appendChild(label)

      const b = document.createElement('div')
      b.className = 'block'
      blocksEl.appendChild(b)
      blocks.push(b)
    }

    function pad2(n) { return String(n).padStart(2, '0') }
    function pad3(n) { return String(n).padStart(3, '0') }

    async function syncTime() {
      const TRIES = 5, KEEP = 3
      const results = []
      for (let i = 0; i < TRIES; i++) {
        const t0 = Date.now()
        try {
          const res = await fetch(`./ticket-practice.html?timesync=${Date.now()}`, {
            method: 'HEAD', cache: 'no-store'
          })
          const t1 = Date.now()
          const dateHeader = res.headers.get('Date')
          if (!dateHeader) continue
          const serverMs = new Date(dateHeader).getTime()
          if (isNaN(serverMs)) continue
          results.push({ offset: (serverMs + 500) - (t0 + t1) / 2, rtt: t1 - t0 })
        } catch (_) {}
      }
      if (!results.length) return
      results.sort((a, b) => a.rtt - b.rtt)
      const best = results.slice(0, KEEP)
      timeOffset = Math.round(best.reduce((s, r) => s + r.offset, 0) / best.length)
    }

    function tick() {
      const now   = new Date(Date.now() + timeOffset)
      const h     = now.getHours()
      const m     = now.getMinutes()
      const s     = now.getSeconds()
      const ms    = now.getMilliseconds()
      const tenth = Math.floor(ms / 100)

      hhEl.textContent = pad2(h)
      mmEl.textContent = pad2(m)
      ssEl.textContent = pad2(s)
      msEl.textContent = pad3(ms)
      fillEl.style.width = (ms / 10).toFixed(2) + '%'

      const secChanged = s !== prevSec
      prevSec = s

      // tenth=0 → displayIndex=9（.0 在最右），tenth=1 → 0（.1 在最左），以此類推
      const displayActive = (tenth + 9) % 10

      for (let i = 0; i < TOTAL; i++) {
        const b = blocks[i]
        const isWarn = i >= 8
        if (i === displayActive) {
          b.className = 'block active' + (isWarn ? ' warn' : '')
          if (secChanged && i === 9) {
            b.classList.add('flash')
            b.addEventListener('animationend', () => b.classList.remove('flash'), { once: true })
          }
        } else if (i < displayActive) {
          b.className = 'block past' + (isWarn ? ' warn-past' : '')
        } else {
          b.className = 'block'
        }
      }

      requestAnimationFrame(tick)
    }

    requestAnimationFrame(tick)
    syncTime()

    // 記錄時間
    function recordTime(atMs) {
      const now = new Date(atMs != null ? atMs : (Date.now() + timeOffset))
      const h   = now.getHours()
      const m   = now.getMinutes()
      const s   = now.getSeconds()
      const ms  = now.getMilliseconds()

      logCount++

      const item = document.createElement('div')
      item.className = 'log-item'
      item.innerHTML = `
        <span class="log-index">${logCount}</span>
        <span class="log-time">
          ${pad2(h)}<span style="color:#333">:</span>${pad2(m)}<span style="color:#333">:</span>${pad2(s)}<span class="log-ms">.${pad3(ms)}</span>
        </span>
      `
      logList.prepend(item)
    }

    // Enter 鍵
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') recordTime()
    })

    // 觸控／滑鼠輕觸記錄（避免捲動時誤觸發）
    const TAP_MOVE_THRESHOLD = 10
    let tapTracking = null

    document.addEventListener('pointerdown', (e) => {
      if (!e.isPrimary) return
      if (e.target.closest('#btn-clear, #btn-export, .nav-back')) return
      tapTracking = {
        id: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        moved: false,
        pressedAt: Date.now() + timeOffset
      }
    })

    document.addEventListener('pointermove', (e) => {
      if (!tapTracking || e.pointerId !== tapTracking.id) return
      const dx = Math.abs(e.clientX - tapTracking.startX)
      const dy = Math.abs(e.clientY - tapTracking.startY)
      if (dx > TAP_MOVE_THRESHOLD || dy > TAP_MOVE_THRESHOLD) {
        tapTracking.moved = true
      }
    })

    document.addEventListener('pointerup', (e) => {
      if (!tapTracking || e.pointerId !== tapTracking.id) return
      const shouldRecord = !tapTracking.moved
      const pressedAt = tapTracking.pressedAt
      tapTracking = null
      if (shouldRecord) recordTime(pressedAt)
    })

    document.addEventListener('pointercancel', () => {
      tapTracking = null
    })

    document.getElementById('btn-clear').addEventListener('click', () => {
      logList.innerHTML = ''
      logCount = 0
    })

    // 匯出記錄到剪貼簿
    const btnExport = document.getElementById('btn-export')
    btnExport.addEventListener('click', () => {
      const items = logList.querySelectorAll('.log-item')
      if (!items.length) return

      const lines = [...items].reverse().map((item, i) => {
        const time = item.querySelector('.log-time').textContent.trim().replace(/\s+/g, '')
        return `${i + 1}\t${time}`
      }).join('\n')

      function onCopied() {
        btnExport.textContent = '已複製！'
        btnExport.classList.add('copied')
        setTimeout(() => {
          btnExport.textContent = '匯出記錄'
          btnExport.classList.remove('copied')
        }, 2000)
      }

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(lines).then(onCopied).catch(() => fallbackCopy(lines, onCopied))
      } else {
        fallbackCopy(lines, onCopied)
      }
    })

    function fallbackCopy(text, onCopied) {
      const ta = document.createElement('textarea')
      ta.value = text
      ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0'
      document.body.appendChild(ta)
      ta.focus(); ta.select()
      try { document.execCommand('copy'); onCopied() } catch (_) {}
      document.body.removeChild(ta)
    }
  </script>
</body>
</html>
