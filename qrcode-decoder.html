<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code 解碼器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 40px;
      width: 100%;
      max-width: 520px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 24px;
    }

    .drop-zone {
      border: 2px dashed #ccc;
      border-radius: 10px;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    .drop-zone.dragover {
      border-color: #0068b7;
      background: #f0f7ff;
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-icon {
      font-size: 40px;
      margin-bottom: 12px;
      color: #aaa;
    }

    .drop-hint {
      font-size: 14px;
      color: #888;
      line-height: 1.6;
    }

    .drop-hint strong {
      display: block;
      font-size: 15px;
      color: #444;
      margin-bottom: 4px;
    }

    .preview-wrap {
      margin-top: 24px;
      text-align: center;
      display: none;
    }

    .preview-wrap.visible { display: block; }

    #preview-img {
      max-width: 100%;
      max-height: 280px;
      border-radius: 8px;
      border: 1px solid #eee;
    }

    .result-box {
      margin-top: 20px;
      display: none;
    }

    .result-box.visible { display: block; }

    .result-label {
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 8px;
    }

    .result-text {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      background: #fafafa;
      color: #1a1a1a;
      resize: vertical;
      min-height: 80px;
      outline: none;
      word-break: break-all;
    }

    .btn-copy {
      margin-top: 10px;
      padding: 9px 20px;
      background: #0068b7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-copy:hover { background: #005499; }

    .btn-copy.copied {
      background: #28a745;
    }

    .error {
      margin-top: 16px;
      padding: 10px 14px;
      background: #fff0f0;
      border: 1px solid #fcc;
      border-radius: 6px;
      color: #c00;
      font-size: 13px;
      display: none;
    }

    .error.visible { display: block; }

    canvas { display: none; }
    .nav-back { display: inline-block; margin-bottom: 16px; text-decoration: none; color: #0068b7; font-size: 13px; font-weight: 600; }
    .nav-back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <a href="index.html" class="nav-back">← 返回首頁</a>
    <h1>QR Code 解碼器</h1>

    <div class="drop-zone" id="drop-zone">
      <input type="file" id="file-input" accept="image/*">
      <div class="drop-icon">&#128247;</div>
      <div class="drop-hint">
        <strong>拖曳 QR Code 圖片到這裡</strong>
        或點擊選擇檔案（JPG、PNG、GIF、WebP）
      </div>
    </div>

    <div class="error" id="error-msg"></div>

    <div class="preview-wrap" id="preview-wrap">
      <img id="preview-img" alt="預覽圖">
    </div>

    <div class="result-box" id="result-box">
      <div class="result-label">解碼結果</div>
      <textarea class="result-text" id="result-text" readonly></textarea>
      <button class="btn-copy" id="btn-copy">複製</button>
    </div>
  </div>

  <canvas id="hidden-canvas"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    const dropZone   = document.getElementById('drop-zone')
    const fileInput  = document.getElementById('file-input')
    const errorEl    = document.getElementById('error-msg')
    const previewWrap = document.getElementById('preview-wrap')
    const previewImg = document.getElementById('preview-img')
    const resultBox  = document.getElementById('result-box')
    const resultText = document.getElementById('result-text')
    const btnCopy    = document.getElementById('btn-copy')
    const canvas     = document.getElementById('hidden-canvas')
    const ctx        = canvas.getContext('2d')

    function showError(msg) {
      errorEl.textContent = msg
      errorEl.classList.add('visible')
      resultBox.classList.remove('visible')
    }

    function hideError() {
      errorEl.classList.remove('visible')
    }

    function decode(file) {
      if (!file || !file.type.startsWith('image/')) {
        showError('請選擇有效的圖片檔案。')
        return
      }

      hideError()
      resultBox.classList.remove('visible')

      const reader = new FileReader()
      reader.onload = (e) => {
        const img = new Image()
        img.onload = () => {
          previewImg.src = e.target.result
          previewWrap.classList.add('visible')

          canvas.width  = img.naturalWidth
          canvas.height = img.naturalHeight
          ctx.drawImage(img, 0, 0)

          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height)
          const code = jsQR(imageData.data, imageData.width, imageData.height)

          if (code) {
            resultText.value = code.data
            resultBox.classList.add('visible')
          } else {
            showError('無法辨識 QR Code，請確認圖片清晰且包含完整的 QR Code。')
          }
        }
        img.src = e.target.result
      }
      reader.readAsDataURL(file)
    }

    // 拖曳事件
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault()
      dropZone.classList.add('dragover')
    })

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover')
    })

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault()
      dropZone.classList.remove('dragover')
      decode(e.dataTransfer.files[0])
    })

    // 點擊選檔
    fileInput.addEventListener('change', () => {
      decode(fileInput.files[0])
      fileInput.value = ''
    })

    // 複製
    btnCopy.addEventListener('click', () => {
      navigator.clipboard.writeText(resultText.value).then(() => {
        btnCopy.textContent = '已複製！'
        btnCopy.classList.add('copied')
        setTimeout(() => {
          btnCopy.textContent = '複製'
          btnCopy.classList.remove('copied')
        }, 2000)
      })
    })
  </script>
</body>
</html>
