      <path d="M28 84c0-51 31-78 69-78s69 27 69 78H28Z" fill="#deaa6a" stroke="#584a36" stroke-width="5"/>
      <rect x="69" y="78" width="56" height="74" rx="22" fill="#f3e7ce" stroke="#584a36" stroke-width="5"/>
      <path d="m65 28 10-19 13 16 11-23 12 23 13-16 10 19" fill="#957846" stroke="#584a36" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="91" cy="94" r="5" fill="#453a30"/><circle cx="111" cy="94" r="5" fill="#453a30"/>
      <path d="M92 112q9-8 18 0" fill="none" stroke="#453a30" stroke-width="4" stroke-linecap="round"/>
