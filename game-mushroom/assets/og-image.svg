    <text x="65.5" y="30" text-anchor="middle" fill="#f7efd9" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC','PingFang TC',sans-serif" font-size="18" font-weight="750">逐字攻擊</text>
