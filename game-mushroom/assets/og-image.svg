<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">無限高湯討伐隊</title>
  <desc id="desc">逐字英打、收集菇幣、強化設備，挑戰菇王。</desc>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#182b26"/><stop offset=".58" stop-color="#34513d"/><stop offset="1" stop-color="#71563c"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e5c48f"/><stop offset="1" stop-color="#b27b4c"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#fff5da"/><stop offset=".55" stop-color="#e5d4b1"/><stop offset="1" stop-color="#bca27a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe7a5"/><stop offset="1" stop-color="#e5a84d"/>
    </linearGradient>
    <pattern id="grain" width="180" height="80" patternUnits="userSpaceOnUse">
      <path d="M-20 20c46-15 72 12 115-2s58-11 100 1M-15 58c50 12 73-15 120-4s55 8 98-4" fill="none" stroke="#77502f" stroke-opacity=".18" stroke-width="3"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#back)"/>
  <circle cx="930" cy="287" r="246" fill="#d69c56" opacity=".09"/>
  <circle cx="930" cy="287" r="196" fill="none" stroke="#e9c982" stroke-opacity=".2" stroke-width="2" stroke-dasharray="5 13"/>
  <ellipse cx="894" cy="518" rx="263" ry="37" fill="#101a16" opacity=".42" filter="url(#shadow)"/>

  <g transform="translate(80 72)">
    <rect width="156" height="38" rx="19" fill="#e9c982"/>
    <text x="78" y="25" text-anchor="middle" fill="#26392d" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC','PingFang TC',sans-serif" font-size="17" font-weight="800" letter-spacing="2">英打練習遊戲</text>
  </g>
  <text x="78" y="220" fill="#fff4dc" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC','PingFang TC',sans-serif" font-size="63" font-weight="900" letter-spacing="2">無限高湯</text>
  <text x="78" y="302" fill="#fff4dc" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC','PingFang TC',sans-serif" font-size="63" font-weight="900" letter-spacing="2">討伐隊</text>
  <path d="M82 333h312" stroke="#e9c982" stroke-width="5" stroke-linecap="round"/>
  <text x="82" y="383" fill="#e9c982" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC','PingFang TC',sans-serif" font-size="29" font-weight="800" letter-spacing="1">敲字集火・爽快討菇</text>
  <text x="82" y="431" fill="#e8ebdf" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC','PingFang TC',sans-serif" font-size="21" font-weight="500">打出每一個正確字元，累積火力討伐菇王。</text>
  <g transform="translate(82 477)">
