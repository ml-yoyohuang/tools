      <text x="425" y="37" text-anchor="middle" fill="#355140" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans',sans-serif" font-size="27" font-weight="900" transform="rotate(8 425 29)">Aa!</text>
      <path d="m287 113 13-19 13 19 22-2-12 18 8 20-22-6-17 14-1-22-19-12Z" fill="url(#gold)" stroke="#795a35" stroke-width="3"/>
      <text x="300" y="133" text-anchor="middle" fill="#714c21" font-family="Arial,sans-serif" font-size="16" font-weight="900">×2</text>
