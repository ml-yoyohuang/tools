    <text x="210.5" y="30" text-anchor="middle" fill="#f7efd9" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC','PingFang TC',sans-serif" font-size="18" font-weight="750">收集強化</text>
    <rect x="290" width="131" height="47" rx="23.5" fill="#41634d" stroke="#719070" stroke-width="1.5"/>
    <text x="355.5" y="30" text-anchor="middle" fill="#f7efd9" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC','PingFang TC',sans-serif" font-size="18" font-weight="750">挑戰菇王</text>
