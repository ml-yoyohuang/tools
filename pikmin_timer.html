<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皮克敏搶蘑菇計時器 Pro</title>
    
    <meta property="og:title" content="皮克敏搶蘑菇計時器 Pro">
    <meta property="og:description" content="專為皮克敏玩家設計，支援重生時間補償與絕對時間戳計時，精準掌握蘑菇重生時刻！">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ml-yoyohuang.github.io/tools/pikmin_timer.html"> 
    <meta property="og:image" content="https://ml-yoyohuang.github.io/tools/og-pikmin.png"> 
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="皮克敏搶蘑菇計時器 Pro">
    <meta name="twitter:description" content="精準計算皮克敏蘑菇重生時間，支援多人同步對時。">
    <meta name="twitter:image" content="https://ml-yoyohuang.github.io/tools/og-pikmin.png">

    <style>
        * { box-sizing: border-box; }
        :root {
            --primary-color: #4CAF50;
            --danger-color: #f44336;
            --secondary-color: #666;
            --bg-color: #e8f5e9;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 500px; }
        h2 { color: #2e7d32; text-align: center; margin-bottom: 20px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }

        .config-panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .input-group { display: flex; align-items: center; margin-bottom: 5px; gap: 10px; width: 100%; }
        .input-group label { font-weight: bold; font-size: 0.9em; color: #555; white-space: nowrap; }

        input[type="text"] {
            flex-grow: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
            min-width: 0; /* 讓 flex 項目可以縮小到比內容窄，避免撐破外殼 */
        }
        input[type="text"]:focus { border-color: var(--primary-color); }

        .add-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            flex-shrink: 0; /* 修正：不准被壓縮 */
            white-space: nowrap; /* 修正：強制不換行 */
        }

        .timer-list { display: flex; flex-direction: column; gap: 15px; }

        .timer-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-left: 6px solid var(--primary-color);
            transition: all 0.4s ease;
        }

        .timer-card.finished {
            border-left-color: var(--danger-color);
            background-color: #fff0f0;
            box-shadow: 0 0 15px rgba(244, 67, 54, 0.4);
            animation: pulse-bg 2s infinite;
        }

        @keyframes pulse-bg {
            0% { background-color: #fff0f0; box-shadow: 0 0 10px rgba(244, 67, 54, 0.2); }
            50% { background-color: #ffe0e0; box-shadow: 0 0 20px rgba(244, 67, 54, 0.5); }
            100% { background-color: #fff0f0; box-shadow: 0 0 10px rgba(244, 67, 54, 0.2); }
        }

        .timer-content { flex-grow: 1; margin-right: 15px; overflow: hidden; }
        .timer-name {
            border: none;
            font-size: 17px;
            font-weight: bold;
            width: 100%;
            margin-bottom: 2px;
            display: block;
            outline: none;
            background: transparent;
        }

        .expire-time { font-size: 12px; color: var(--secondary-color); margin-bottom: 8px; }
        .time-display { font-size: 32px; font-family: 'Courier New', Courier, monospace; font-weight: bold; color: #333; }
        
        .finished .time-display { color: var(--danger-color); }

        .delete-btn {
            background-color: #ffeeee;
            color: var(--danger-color);
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            flex-shrink: 0; /* 修正：刪除按鈕也不准被壓縮 */
            white-space: nowrap;
        }

        .hint { font-size: 12px; color: #888; margin-bottom: 15px; padding-left: 2px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🍄 皮克敏搶蘑菇計時器</h2>

    <div class="config-panel">
        <div class="input-group">
            <label>重生時間差:</label>
            <input type="text" id="offsetInput" placeholder="MM:SS 或 HH:MM:SS" style="max-width: 120px;">
        </div>
        <div class="hint">(如 04:30，修改後自動儲存)</div>

        <div class="input-group">
            <input type="text" id="newTimeInput" placeholder="輸入蘑菇剩餘時間" onkeypress="handleKeyPress(event)">
            <button class="add-btn" onclick="addTimer()">啟動</button>
        </div>
        <div class="hint">(如 24:00 或 1:20:00)</div>
    </div>

    <div id="timerList" class="timer-list"></div>
</div>

<script>
    let timers = [];

    window.onload = function() {
        const savedOffset = localStorage.getItem('pikmin_offset') || "04:30";
        document.getElementById('offsetInput').value = savedOffset;

        document.getElementById('offsetInput').addEventListener('change', function() {
            localStorage.setItem('pikmin_offset', this.value);
        });

        const savedTimers = JSON.parse(localStorage.getItem('pikmin_timers') || "[]");
        const now = Date.now();
        timers = savedTimers.filter(t => t.endTime > now - 600000);
        
        refreshList();
    };

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            addTimer();
        }
    }

    function saveToLocalStorage() {
        localStorage.setItem('pikmin_timers', JSON.stringify(timers));
    }

    function parseTimeToSeconds(str) {
        const p = str.trim().split(':');
        let h = 0, m = 0, s = 0;
        if (p.length === 3) {
            h = parseInt(p[0]); m = parseInt(p[1]); s = parseInt(p[2]);
        } else if (p.length === 2) {
            m = parseInt(p[0]); s = parseInt(p[1]);
        } else { return null; }
        if (isNaN(h) || isNaN(m) || isNaN(s)) return null;
        return (h * 3600) + (m * 60) + s;
    }

    function formatSeconds(s) {
        if (s <= 0) return "00:00";
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = s % 60;
        if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
    }

    function formatToLocalTime(timestamp) {
        const date = new Date(timestamp);
        return date.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function refreshList() {
        timers.sort((a, b) => a.endTime - b.endTime);
        const list = document.getElementById('timerList');
        list.innerHTML = ""; 
        timers.forEach(t => renderTimerCard(t));
        saveToLocalStorage();
    }

    function addTimer() {
        const timeInput = document.getElementById('newTimeInput');
        const offsetVal = document.getElementById('offsetInput').value;
        const mushroomSec = parseTimeToSeconds(timeInput.value);
        const offsetSec = parseTimeToSeconds(offsetVal);

        if (mushroomSec === null || offsetSec === null) return;

        const endTime = Date.now() + (mushroomSec + offsetSec) * 1000;
        const newTimer = { id: Date.now(), name: "新蘑菇任務", endTime: endTime };

        timers.push(newTimer);
        refreshList();
        
        timeInput.value = ""; 
        timeInput.focus();
    }

    function renderTimerCard(timerObj) {
        const list = document.getElementById('timerList');
        const card = document.createElement('div');
        card.className = 'timer-card';
        card.id = `timer-${timerObj.id}`;
        
        const expireLabel = formatToLocalTime(timerObj.endTime);

        card.innerHTML = `
            <div class="timer-content">
                <input type="text" class="timer-name" value="${timerObj.name}" 
                    onchange="updateTimerName(${timerObj.id}, this.value)">
                <div class="expire-time">🚩 預計到期：${expireLabel}</div>
                <div class="time-display" id="display-${timerObj.id}">--:--</div>
            </div>
            <button class="delete-btn" onclick="deleteTimer(${timerObj.id})">刪除</button>
        `;

        list.appendChild(card);

        const checkStatus = () => {
            const now = Date.now();
            const diff = Math.round((timerObj.endTime - now) / 1000);
            const displayEl = document.getElementById(`display-${timerObj.id}`);
            const parentCard = document.getElementById(`timer-${timerObj.id}`);

            if (!displayEl || !parentCard) return;

            if (diff <= 0) {
                displayEl.innerText = "00:00";
                if (!parentCard.classList.contains('finished')) {
                    parentCard.classList.add('finished');
                }
            } else {
                displayEl.innerText = formatSeconds(diff);
                setTimeout(checkStatus, 1000);
            }
        };
        checkStatus();
    }

    function updateTimerName(id, newName) {
        const timer = timers.find(t => t.id === id);
        if (timer) {
            timer.name = newName;
            saveToLocalStorage();
        }
    }

    function deleteTimer(id) {
        timers = timers.filter(t => t.id !== id);
        refreshList();
    }
</script>

</body>
</html>
