<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>花朵變色濾鏡 Shader 還原</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1f6;--fg:#2c2a30;--muted:#6d6874;--line:#d9d2e0;--accent:#e9826d;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b20;--fg:#ece8f0;--muted:#a59fad;--line:#3a3540;--accent:#f2917d}}
:root[data-theme="dark"]{--bg:#1d1b20;--fg:#ece8f0;--muted:#a59fad;--line:#3a3540;--accent:#f2917d}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.35rem;font-weight:600;margin:0 0 4px}
p.lead{margin:0 0 20px;color:var(--muted);max-width:68ch}
.stage{position:relative;width:100%;aspect-ratio:802/263;border-radius:4px;overflow:hidden;background:#ddd}
canvas{display:block;width:100%;height:100%}
.tag{position:absolute;left:44.2%;top:35.5%;transform:translateX(-100%);background:#fff;color:#555;font:600 clamp(5px,.75vw,8px)/1 system-ui,sans-serif;padding:2px 3px;letter-spacing:.04em}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 24px;margin-top:20px}
label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.file{display:inline-block;margin-top:18px;padding:8px 14px;border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--fg)}
.file:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.nav-back{display:inline-block;margin-bottom:16px;text-decoration:none;color:var(--accent);font-weight:600}
.nav-back:hover{text-decoration:underline}
</style>
</head>
<body>
<main>
<a href="index.html" class="nav-back">← 返回首頁</a>
<h1>花朵變色濾鏡 · WebGL Shader 還原</h1>
<p class="lead">預設使用程式生成的花朵當示範。載入你的原始花朵照片後，背景會走「漸層映射」，三個方框走「放大＋模糊＋雙色調」，全畫面再疊一層底片顆粒。</p>
<div class="stage"><canvas id="c"></canvas><span class="tag">FOUNDER</span></div>
<label class="file">載入花朵照片<input type="file" id="file" accept="image/*"></label>
<div class="controls">
  <label>色階偏移（決定哪裡變珊瑚、哪裡變薰衣草）<input type="range" id="shift" min="-0.4" max="0.4" step="0.01" value="0"></label>
  <label>對比曲線<input type="range" id="contrast" min="0.5" max="2.5" step="0.01" value="1.3"></label>
  <label>背景柔化<input type="range" id="bgBlur" min="0" max="0.02" step="0.0005" value="0.004"></label>
  <label>方框模糊<input type="range" id="pBlur" min="0" max="0.08" step="0.001" value="0.035"></label>
  <label>方框放大倍率<input type="range" id="zoom" min="1" max="4" step="0.05" value="2.2"></label>
  <label>顆粒強度<input type="range" id="grain" min="0" max="0.2" step="0.005" value="0.06"></label>
</div>
</main>
<script>
const VS=`attribute vec2 p;varying vec2 vUv;void main(){vUv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const FS=`precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;uniform vec2 uRes,uTexScale;
uniform float uTime,uShift,uContrast,uBgBlur,uPBlur,uZoom,uGrain;
uniform vec4 uRect[3];uniform vec3 uDark[3],uLight[3];

vec2 coverUV(vec2 uv){return (uv-.5)*uTexScale+.5;}
vec3 tex(vec2 uv){return texture2D(uTex,clamp(coverUV(uv),0.,1.)).rgb;}
// 黃金角螺旋取樣的圓盤模糊
vec3 blurTex(vec2 uv,float r){
  if(r<=0.)return tex(uv);
  vec3 acc=vec3(0.);
  for(int i=0;i<32;i++){float f=float(i);float a=f*2.39996;float rr=sqrt((f+.5)/32.)*r;
    acc+=tex(uv+vec2(cos(a),sin(a))*rr*vec2(uRes.y/uRes.x,1.));}
  return acc/32.;
}
float luma(vec3 c){return dot(c,vec3(.299,.587,.114));}
// 漸層映射：暗灰 → 珊瑚 → 淡粉 → 薰衣草 → 近白（取樣自你的截圖）
vec3 gradMap(float t){
  vec3 c0=vec3(.24,.24,.26),c1=vec3(.949,.569,.490),c2=vec3(.957,.675,.608),c3=vec3(.867,.769,.937),c4=vec3(.906,.863,.933);
  if(t<.30)return mix(c0,c1,smoothstep(0.,.30,t));
  if(t<.50)return mix(c1,c2,smoothstep(.30,.50,t));
  if(t<.72)return mix(c2,c3,smoothstep(.50,.72,t));
  return mix(c3,c4,smoothstep(.72,1.,t));
}
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}

void main(){
  vec2 uv=vUv; vec2 tl=vec2(uv.x,1.-uv.y); // 左上原點，方便對齊截圖座標
  // 背景：亮度 → 對比曲線 → 漸層映射
  float L=luma(blurTex(uv,uBgBlur));
  L=clamp(pow(L,uContrast)+uShift,0.,1.);
  vec3 col=gradMap(L);
  // 三個方框：放大、強模糊、灰階雙色調
  for(int i=0;i<3;i++){
    vec4 r=uRect[i];
    vec2 local=(tl-r.xy)/r.zw;
    if(all(greaterThanEqual(local,vec2(0.)))&&all(lessThanEqual(local,vec2(1.)))){
      vec2 center=r.xy+r.zw*.5;
      vec2 src=center+(tl-center)/uZoom; src.y=1.-src.y;
      float l=luma(blurTex(src,uPBlur));
      l=smoothstep(.15,.85,l);
      col=mix(uDark[i],uLight[i],l);
      // 小方框的白色細邊
      if(i==1){vec2 px=r.zw*uRes;vec2 d=min(local,1.-local)*px;if(min(d.x,d.y)<1.5)col=vec3(.93);}
    }
  }
  // 底片顆粒（每幀變動）
  float n=hash(gl_FragCoord.xy+fract(uTime)*97.)-.5;
  col+=n*uGrain;
  gl_FragColor=vec4(col,1.);
}`;
const cv=document.getElementById('c'),gl=cv.getContext('webgl');
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);
// 方框位置（以截圖 802×263 量測，左上原點的比例）
gl.uniform4fv(U('uRect'),[0.060,0.297,0.202,0.703, 0.354,0.023,0.130,0.388, 0.567,0.217,0.291,0.783]);
gl.uniform3fv(U('uDark'),[0.37,0.52,0.48, 0.38,0.38,0.38, 0.40,0.40,0.41]);
gl.uniform3fv(U('uLight'),[0.91,0.93,0.92, 0.95,0.95,0.95, 0.95,0.95,0.95]);
const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE));
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
let texAspect=1;
function upload(src,w,h){gl.bindTexture(gl.TEXTURE_2D,tx);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);texAspect=w/h;}
// 程式生成的示範花朵
(function(){const s=1024,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
  x.fillStyle='#e9e6ec';x.fillRect(0,0,s,s);x.filter='blur(5px)';
  const layers=[[11,470,170,0],[9,360,150,.3],[7,240,120,.6],[6,140,80,.2]];
  layers.forEach(([n,len,wid,off],li)=>{for(let i=0;i<n;i++){const a=i/n*Math.PI*2+off;x.save();x.translate(s/2,s/2);x.rotate(a);
    const g=x.createLinearGradient(0,0,len,0);g.addColorStop(0,'#2a2a2a');g.addColorStop(.35,'#7a7a7a');g.addColorStop(.75,'#bdbdbd');g.addColorStop(1,'#f6f6f6');
    x.fillStyle=g;x.beginPath();x.ellipse(len*.5,0,len*.55,wid*.5,0,0,Math.PI*2);x.fill();x.restore();}});
  x.filter='none';upload(c,s,s);})();
document.getElementById('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const im=new Image();
  im.onload=()=>{const m=2048,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k|0;c.height=im.height*k|0;
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);upload(c,c.width,c.height);URL.revokeObjectURL(im.src);};im.src=URL.createObjectURL(f);});
const ids=['shift','contrast','bgBlur','pBlur','zoom','grain'],names={shift:'uShift',contrast:'uContrast',bgBlur:'uBgBlur',pBlur:'uPBlur',zoom:'uZoom',grain:'uGrain'};
function resize(){const d=Math.min(devicePixelRatio||1,2),r=cv.getBoundingClientRect();cv.width=r.width*d|0;cv.height=r.height*d|0;gl.viewport(0,0,cv.width,cv.height);}
addEventListener('resize',resize);resize();
function frame(t){const ca=cv.width/cv.height;
  // 讓照片以 cover 方式填滿
  gl.uniform2f(U('uTexScale'),ca>texAspect?1:ca/texAspect,ca>texAspect?texAspect/ca:1);
  gl.uniform2f(U('uRes'),cv.width,cv.height);gl.uniform1f(U('uTime'),t*.001);
  ids.forEach(i=>gl.uniform1f(U(names[i]),parseFloat(document.getElementById(i).value)));
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</body>
</html>
