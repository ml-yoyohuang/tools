<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原子級稱謂神算機 - 邏輯完備旗艦版</title>
    <style>
        :root { --bg-black: #000000; --btn-gray: #333333; --btn-lightgray: #a5a5a5; --btn-orange: #ff9f0a; --text-white: #ffffff; }
        body { background-color: var(--bg-black); font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .calculator { width: 340px; padding: 20px; border-radius: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .display { color: var(--text-white); text-align: right; padding: 20px; min-height: 160px; display: flex; flex-direction: column; justify-content: flex-end; }
        #pathDisp { font-size: 14px; color: var(--btn-lightgray); margin-bottom: 8px; word-wrap: break-word; min-height: 20px; line-height: 1.4; }
        #resDisp { font-size: 38px; font-weight: 300; }
        #altDisp { font-size: 13px; color: var(--btn-lightgray); min-height: 20px; margin-top: 8px; line-height: 1.35; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        button { aspect-ratio: 1/1; border-radius: 50%; border: none; font-size: 22px; color: var(--text-white); cursor: pointer; transition: background 0.1s; }
        button:active { filter: brightness(1.3); }
        .btn-gray { background-color: var(--btn-gray); }
        .btn-orange { background-color: var(--btn-orange); }
        .btn-light { background-color: var(--btn-lightgray); color: black; font-weight: bold; }
    </style>
</head>
<body>

<div class="calculator">
    <div class="display">
        <div id="pathDisp">我</div>
        <div id="resDisp">我</div>
        <div id="altDisp"></div>
    </div>
    <div class="buttons">
        <button class="btn-light" onclick="reset()">AC</button>
        <button class="btn-light" onclick="back()">←</button>
        <button class="btn-gray" onclick="add('h', '夫')">夫</button>
        <button class="btn-orange" onclick="add('f', '父')">父</button>
        
        <button class="btn-gray" onclick="add('ob', '兄')">兄</button>
        <button class="btn-gray" onclick="add('os', '姊')">姊</button>
        <button class="btn-gray" onclick="add('w', '妻')">妻</button>
        <button class="btn-orange" onclick="add('m', '母')">母</button>

        <button class="btn-gray" onclick="add('yb', '弟')">弟</button>
        <button class="btn-gray" onclick="add('ys', '妹')">妹</button>
        <button class="btn-gray" onclick="add('s', '子')">子</button>
        <button class="btn-gray" onclick="add('d', '女')">女</button>

        <button class="btn-gray" style="visibility:hidden"></button>
        <button class="btn-gray" style="visibility:hidden"></button>
        <button class="btn-gray" style="visibility:hidden"></button>
        <button class="btn-gray" style="visibility:hidden"></button>
    </div>
</div>

<script>
    let inputStack = [];
    let pathHistory = [];

    const REL_NAMES = {
        f: '父', m: '母', ob: '兄', yb: '弟', os: '姊', ys: '妹',
        s: '子', d: '女', h: '夫', w: '妻'
    };

    const ANCESTOR_LEVEL = {
        1: { male: '爸爸', female: '媽媽' },
        2: { male: '阿公', female: '阿嬤' },
        3: { male: '曾祖父', female: '曾祖母' },
        4: { male: '高祖父', female: '高祖母' },
        5: { male: '天祖父', female: '天祖母' },
        6: { male: '烈祖父', female: '烈祖母' },
        7: { male: '太祖父', female: '太祖母' },
        8: { male: '遠祖父', female: '遠祖母' },
        9: { male: '鼻祖父', female: '鼻祖母' }
    };

    const DESCENDANT_LEVEL = {
        1: { male: '兒子', female: '女兒' },
        2: { male: '孫子', female: '孫女' },
        3: { male: '曾孫', female: '曾孫女' },
        4: { male: '玄孫', female: '玄孫女' }
    };

    const RULES = [
        // 本人
        rule([], result('我', [], 100)),

        // 直系與平輩
        rule(['f'], result('爸爸', [], 100)),
        rule(['m'], result('媽媽', [], 100)),
        rule(['ob'], result('哥哥', [], 100)),
        rule(['yb'], result('弟弟', [], 100)),
        rule(['os'], result('姊姊', [], 100)),
        rule(['ys'], result('妹妹', [], 100)),
        rule(['s'], result('兒子', [], 100)),
        rule(['d'], result('女兒', [], 100)),
        rule(['h'], result('老公', [], 100)),
        rule(['w'], result('老婆', [], 100)),

        // 祖父母
        rule(['f', 'f'], result('阿公', [], 100)),
        rule(['f', 'm'], result('阿嬤', [], 100)),
        rule(['m', 'f'], result('外公', [], 100)),
        rule(['m', 'm'], result('外婆', [], 100)),

        // 父母手足
        rule(['f', 'ob'], result('伯父', ['伯伯'], 95)),
        rule(['f', 'yb'], result('叔叔', ['叔父'], 95)),
        rule(['f', ['os', 'ys']], result('姑姑', ['姑媽'], 95)),
        rule(['m', ['ob', 'yb']], result('舅舅', [], 95)),
        rule(['m', ['os', 'ys']], result('阿姨', ['姨媽'], 95)),

        // 父母手足配偶
        rule(['f', 'ob', 'w'], result('伯母', [], 90)),
        rule(['f', 'yb', 'w'], result('嬸嬸', ['嬸母'], 90)),
        rule(['f', ['os', 'ys'], 'h'], result('姑丈', [], 90)),
        rule(['m', ['ob', 'yb'], 'w'], result('舅媽', [], 90)),
        rule(['m', ['os', 'ys'], 'h'], result('姨丈', [], 90)),

        // 兄弟姊妹配偶
        rule(['os', 'h'], result('姊夫', [], 100)),
        rule(['ys', 'h'], result('妹婿', [], 100)),
        rule(['ob', 'w'], result('嫂嫂', ['嫂子'], 100)),
        rule(['yb', 'w'], result('弟媳', [], 100)),

        // 姻親直系
        rule(['h', 'f'], result('公公', [], 100)),
        rule(['h', 'm'], result('婆婆', [], 100)),
        rule(['w', 'f'], result('岳父', [], 100)),
        rule(['w', 'm'], result('岳母', [], 100)),
        rule(['s', 'w'], result('媳婦', ['兒媳婦'], 100)),
        rule(['d', 'h'], result('女婿', [], 100)),

        // 可逆規則：配偶側（夫/妻 -> 子女 -> 父母）
        rule(['h', ['s', 'd'], 'm'], result('我', ['前妻'], 60)),
        rule(['h', ['s', 'd'], 'f'], result('老公', ['前夫'], 65)),
        rule(['w', ['s', 'd'], 'f'], result('我', ['前夫'], 60)),
        rule(['w', ['s', 'd'], 'm'], result('老婆', ['前妻'], 65)),

        // 可逆規則：配偶側（夫/妻 -> 子女 -> 配偶）
        rule(['h', 's', 'w'], result('媳婦', ['兒媳婦'], 85)),
        rule(['h', 'd', 'h'], result('女婿', [], 85)),
        rule(['w', 's', 'w'], result('媳婦', ['兒媳婦'], 85)),
        rule(['w', 'd', 'h'], result('女婿', [], 85)),

        // 可逆規則：配偶側（夫/妻 -> 父母 -> 子女）
        rule(['h', ['f', 'm'], 's'], result('老公', ['大伯', '小叔'], 55)),
        rule(['h', ['f', 'm'], 'd'], result('大姑', ['小姑'], 55)),
        rule(['w', ['f', 'm'], 's'], result('老婆', ['大舅子', '小舅子'], 55)),
        rule(['w', ['f', 'm'], 'd'], result('大姨子', ['小姨子'], 55)),

        // 可逆規則：配偶側孫輩回推
        rule(['h', 's', ['s', 'd'], 'm'], result('媳婦', ['兒媳婦'], 80)),
        rule(['h', 'd', ['s', 'd'], 'f'], result('女婿', [], 80)),
        rule(['w', 's', ['s', 'd'], 'm'], result('媳婦', ['兒媳婦'], 80)),
        rule(['w', 'd', ['s', 'd'], 'f'], result('女婿', [], 80)),

        // 可逆規則：配偶側四步回推（降低長鏈後備率）
        rule(['h', ['s', 'd'], ['f', 'm'], 's'], result('兒子', ['我'], 70)),
        rule(['h', ['s', 'd'], ['f', 'm'], 'd'], result('女兒', ['我'], 70)),
        rule(['w', ['s', 'd'], ['f', 'm'], 's'], result('兒子', ['我'], 70)),
        rule(['w', ['s', 'd'], ['f', 'm'], 'd'], result('女兒', ['我'], 70)),
        rule(['h', ['f', 'm'], ['s', 'd'], 'm'], result('婆婆', [], 65)),
        rule(['h', ['f', 'm'], ['s', 'd'], 'f'], result('公公', [], 65)),
        rule(['w', ['f', 'm'], ['s', 'd'], 'm'], result('岳母', [], 65)),
        rule(['w', ['f', 'm'], ['s', 'd'], 'f'], result('岳父', [], 65)),

        // 甥姪
        rule([['ob', 'yb'], 's'], result('姪子', [], 100)),
        rule([['ob', 'yb'], 'd'], result('姪女', ['姪女兒'], 100)),
        rule([['os', 'ys'], 's'], result('外甥', [], 100)),
        rule([['os', 'ys'], 'd'], result('外甥女', [], 100)),

        // 可逆規則：平輩回推父母
        rule([['ob', 'yb', 'os', 'ys'], 'f'], result('爸爸', [], 95)),
        rule([['ob', 'yb', 'os', 'ys'], 'm'], result('媽媽', [], 95)),

        // 可逆規則：父母回推子女（父的子、母的女等）
        rule(['f', 's'], result('我', ['哥哥', '弟弟'], 60)),
        rule(['f', 'd'], result('我', ['姊姊', '妹妹'], 60)),
        rule(['m', 's'], result('我', ['哥哥', '弟弟'], 60)),
        rule(['m', 'd'], result('我', ['姊姊', '妹妹'], 60)),

        // 可逆規則：父母→子女→父母（兄的父同型鏈）
        rule([['f', 'm'], ['s', 'd'], 'f'], result('爸爸', [], 85)),
        rule([['f', 'm'], ['s', 'd'], 'm'], result('媽媽', [], 85)),

        // 可逆規則：子女回推父母（依自我性別會有歧義）
        rule([['s', 'd'], 'f'], result('我', ['老公'], 60)),
        rule([['s', 'd'], 'm'], result('我', ['老婆'], 60)),

        // 可逆規則：子女→父母→子女
        rule([['s', 'd'], ['f', 'm'], 's'], result('兒子', ['我'], 65)),
        rule([['s', 'd'], ['f', 'm'], 'd'], result('女兒', ['我'], 65)),

        // 孫輩
        rule(['s', 's'], result('孫子', [], 100)),
        rule(['s', 'd'], result('孫女', [], 100)),
        rule(['d', 's'], result('外孫', [], 100)),
        rule(['d', 'd'], result('外孫女', [], 100)),

        // 孫輩回推父母
        rule(['s', ['s', 'd'], 'm'], result('媳婦', ['兒媳婦'], 90)),
        rule(['s', ['s', 'd'], 'f'], result('兒子', [], 90)),
        rule(['d', ['s', 'd'], 'm'], result('女兒', [], 90)),
        rule(['d', ['s', 'd'], 'f'], result('女婿', [], 90)),

        // 孫輩→父→母（子女→孫輩的父母回推至自己）
        rule([['s', 'd'], ['s', 'd'], 'f', 'm'], result('我', ['老婆'], 65)),
        rule([['s', 'd'], ['s', 'd'], 'm', 'f'], result('我', ['老公'], 65)),

        // 可逆規則：堂表鏈回推上一代
        rule(['f', ['ob', 'yb'], ['s', 'd'], 'f'], result('伯父', ['叔叔'], 70)),
        rule(['f', ['ob', 'yb'], ['s', 'd'], 'm'], result('伯母', ['嬸嬸'], 70)),
        rule(['f', ['os', 'ys'], ['s', 'd'], 'f'], result('姑丈', [], 75)),
        rule(['f', ['os', 'ys'], ['s', 'd'], 'm'], result('姑姑', ['姑媽'], 75)),
        rule(['m', ['ob', 'yb'], ['s', 'd'], 'f'], result('舅舅', [], 75)),
        rule(['m', ['ob', 'yb'], ['s', 'd'], 'm'], result('舅媽', [], 75)),
        rule(['m', ['os', 'ys'], ['s', 'd'], 'f'], result('姨丈', [], 75)),
        rule(['m', ['os', 'ys'], ['s', 'd'], 'm'], result('阿姨', ['姨媽'], 75)),

        // 堂表親（需要候選）
        rule(['f', ['ob', 'yb'], 's'], result('堂哥', ['堂弟'], 50)),
        rule(['f', ['ob', 'yb'], 'd'], result('堂姊', ['堂妹'], 50)),
        rule(['f', ['os', 'ys'], 's'], result('表哥', ['表弟'], 50)),
        rule(['f', ['os', 'ys'], 'd'], result('表姊', ['表妹'], 50)),
        rule(['m', ['ob', 'yb'], 's'], result('表哥', ['表弟'], 50)),
        rule(['m', ['ob', 'yb'], 'd'], result('表姊', ['表妹'], 50)),
        rule(['m', ['os', 'ys'], 's'], result('表哥', ['表弟'], 50)),
        rule(['m', ['os', 'ys'], 'd'], result('表姊', ['表妹'], 50)),

        // 姻親旁系範例
        rule(['os', 'h', 'f'], result('姊夫的父親', [], 20)),
        rule(['os', 'h', 'm'], result('姊夫的母親', [], 20)),
        rule(['ys', 'h', 'f'], result('妹婿的父親', [], 20)),
        rule(['ys', 'h', 'm'], result('妹婿的母親', [], 20))
    ];

    function rule(pattern, value) {
        return { pattern, value };
    }

    function result(primary, alternatives, confidence) {
        return { primary, alternatives, confidence };
    }

    function add(code, name) {
        inputStack.push(code);
        pathHistory.push(name);
        updateUI();
    }

    function normalizePath(path) {
        const out = [];
        for (const token of path) {
            out.push(token);
            let changed = true;
            while (changed) {
                changed = false;
                for (let i = 0; i < out.length - 1; i++) {
                    const a = out[i];
                    const b = out[i + 1];
                    if ((a === 'h' && b === 'w') || (a === 'w' && b === 'h')) {
                        out.splice(i, 2);
                        changed = true;
                        break;
                    }

                    // 子女的兄弟姊妹可還原為同一代子女，避免落入低信心度後備。
                    if ((a === 's' || a === 'd') && (b === 'ob' || b === 'yb' || b === 'os' || b === 'ys')) {
                        const siblingAsChild = (b === 'ob' || b === 'yb') ? 's' : 'd';
                        out.splice(i, 2, siblingAsChild);
                        changed = true;
                        break;
                    }

                    // 配偶的子女 = 自己的子女（標準家庭假設）
                    if ((a === 'h' || a === 'w') && (b === 's' || b === 'd')) {
                        out.splice(i, 2, b);
                        changed = true;
                        break;
                    }
                }
            }
        }
        return out;
    }

    function matches(path, pattern) {
        if (path.length !== pattern.length) return false;
        for (let i = 0; i < path.length; i++) {
            const p = pattern[i];
            const cur = path[i];
            if (Array.isArray(p)) {
                if (!p.includes(cur)) return false;
            } else if (p !== cur) {
                return false;
            }
        }
        return true;
    }

    function tryDirectRules(path) {
        for (const r of RULES) {
            if (matches(path, r.pattern)) return r.value;
        }
        return null;
    }

    function tryGeneratedAncestor(path) {
        if (path.length < 3) return null;
        if (!path.every((x) => x === 'f' || x === 'm')) return null;

        const generation = path.length;
        const last = path[path.length - 1] === 'f' ? 'male' : 'female';
        const startsMaternal = path[0] === 'm';
        const level = ANCESTOR_LEVEL[generation];

        if (!level) {
            const title = `第 ${generation} 代長輩`;
            return result(title, [], 40);
        }

        const base = level[last];
        const name = startsMaternal && generation >= 2 ? `外${base}` : base;
        return result(name, [], 70);
    }

    function tryGeneratedDescendant(path) {
        if (path.length < 3) return null;
        if (!path.every((x) => x === 's' || x === 'd')) return null;

        const generation = path.length;
        const last = path[path.length - 1] === 's' ? 'male' : 'female';
        const startsDaughter = path[0] === 'd';
        const level = DESCENDANT_LEVEL[generation];

        if (!level) {
            const title = `第 ${generation} 代晚輩`;
            return result(title, [], 40);
        }

        const base = level[last];
        const name = startsDaughter && generation >= 2 ? `外${base}` : base;
        return result(name, [], 70);
    }

    function buildFallback(path) {
        if (path.length === 0) return result('我', [], 100);
        const phrase = path.map((x) => REL_NAMES[x] || x).join('的');
        return result(`我的${phrase}`, [], 15);
    }

    function evaluatePath(path) {
        const normalized = normalizePath(path);
        const exact = tryDirectRules(normalized);
        if (exact) return { ...exact, normalized };

        const ancestor = tryGeneratedAncestor(normalized);
        if (ancestor) return { ...ancestor, normalized };

        const descendant = tryGeneratedDescendant(normalized);
        if (descendant) return { ...descendant, normalized };

        return { ...buildFallback(normalized), normalized };
    }

    function updateUI() {
        const output = evaluatePath(inputStack);
        const pathText = pathHistory.length ? `我的${pathHistory.join('的')}` : '我';
        const altText = output.alternatives.length
            ? `候選：${output.primary} / ${output.alternatives.join(' / ')}（信心度 ${output.confidence}%）`
            : (output.confidence < 100 ? `信心度 ${output.confidence}%` : '');

        document.getElementById('pathDisp').innerText = pathText;
        document.getElementById('resDisp').innerText = output.primary;
        document.getElementById('altDisp').innerText = altText;
    }

    function reset() {
        inputStack = [];
        pathHistory = [];
        updateUI();
    }

    function back() {
        if (inputStack.length === 0) return;
        inputStack.pop();
        pathHistory.pop();
        updateUI();
    }

    updateUI();
</script>
</body>
</html>
