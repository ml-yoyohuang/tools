<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>紙龜祈福</title>
  <meta name="description" content="以金紙摺一隻烏龜，寫下心願，親手點燃。">
  <meta name="theme-color" content="#090807">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:title" content="紙龜祈福">
  <meta property="og:description" content="以金紙摺一隻烏龜，寫下心願，親手點燃。">
  <meta property="og:url" content="https://ml-yoyohuang.github.io/tools/paper-turtle/">
  <meta property="og:image" content="https://ml-yoyohuang.github.io/tools/paper-turtle/assets/og.jpg?v=1b0210fc6394">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:alt" content="紙龜祈福：深色展台上一隻金紙摺成的烏龜正在燃燒，焦黑破口邊緣透著火光，右側以金色襯線字寫著紙龜祈福與『寫下心願，親手點燃』">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="紙龜祈福">
  <meta name="twitter:description" content="以金紙摺一隻烏龜，寫下心願，親手點燃。">
  <meta name="twitter:image" content="https://ml-yoyohuang.github.io/tools/paper-turtle/assets/og.jpg?v=1b0210fc6394">
  <meta name="twitter:image:alt" content="紙龜祈福：一隻燃燒中的金紙烏龜，寫下心願，親手點燃。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- Devanagari, only the glyphs of प्रेम and ० – ९, for 十方迴向 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@300;500&display=swap&text=%E0%A4%AA%E0%A5%8D%E0%A4%B0%E0%A5%87%E0%A4%AE%E0%A5%A6%E0%A5%A7%E0%A5%A8%E0%A5%A9%E0%A5%AA%E0%A5%AB%E0%A5%AC%E0%A5%AD%E0%A5%AE%E0%A5%AF" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body data-step="intro">
  <canvas id="gl" aria-hidden="true"></canvas>

  <header class="mark">紙龜祈福</header>
  <ol class="steps" aria-hidden="true"><li></li><li></li><li></li></ol>
  <button class="add remove" id="remove" type="button" aria-label="減少一隻紙龜"></button>
  <button class="add" id="add" type="button" aria-label="多加一隻紙龜"></button>

  <form class="panel p-intro" id="wish-form" autocomplete="off" novalidate>
    <label class="field">
      <span id="place-label">地點</span>
      <div class="control">
        <input id="place" name="place" maxlength="20" enterkeyhint="next" aria-labelledby="place-label">
        <button class="clear" type="button" data-for="place" aria-label="清除地點" tabindex="-1"></button>
      </div>
    </label>
    <label class="field">
      <span id="wish-label">心願</span>
      <div class="control">
        <textarea id="wish" name="wish" rows="1" maxlength="40" enterkeyhint="done" aria-labelledby="wish-label"></textarea>
        <button class="clear" type="button" data-for="wish" aria-label="清除心願" tabindex="-1"></button>
      </div>
    </label>
    <div class="field">
      <span id="date-label">日期</span>
      <div class="date">
        <output id="date-text" aria-hidden="true"></output>
        <input id="date" type="date" aria-labelledby="date-label" required>
      </div>
    </div>
    <button class="ignite" type="submit" disabled>點火</button>
  </form>

  <section class="panel p-burn" aria-live="polite">
    <p class="burn-wish" id="burn-wish"></p>
    <div class="burn-foot">
      <p class="hint" id="hint">按住拖曳，點燃紙龜</p>
      <div class="meter" role="progressbar" aria-label="燒化進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="meter"></i></div>
    </div>
  </section>

  <section class="panel p-finale" aria-live="polite">
    <p class="f-wish" id="f-wish"></p>
    <div class="f-rule"></div>
    <div class="f-row">
      <p class="f-meta"><span id="f-place"></span><span id="f-date"></span></p>
      <img class="seal" id="seal" alt="所願皆成">
    </div>
    <div class="f-actions">
      <button type="button" id="save" class="primary">保存</button>
      <button type="button" id="share" hidden>分享</button>
      <button type="button" id="again">再祈一願</button>
    </div>
    <button class="f-tally" id="f-tally" type="button" hidden><span></span><i aria-hidden="true">›</i></button>
  </section>

  <section class="gallery-ui" aria-label="已燒化的紙龜">
    <button class="g-back" id="g-back" type="button">返回</button>
    <div class="g-foot">
      <p class="g-wish" id="g-wish" aria-live="polite"></p>
      <p class="g-count"><span id="g-count"></span><button class="g-icon g-rite" id="g-rite" type="button" aria-label="十方迴向" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="12" r="5.4" stroke-dasharray="1.2 2.2"/><path d="M12 1.8v3M12 19.2v3M1.8 12h3M19.2 12h3M4.8 4.8l2.1 2.1M17.1 17.1l2.1 2.1M4.8 19.2l2.1-2.1M17.1 6.9l2.1-2.1"/></svg></button><button class="g-icon g-scrolls" id="g-scrolls" type="button" aria-label="歷次迴向" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3.5" width="12" height="17" rx="0.6"/><path d="M14.5 6.5v9M12 6.5v11M9.5 6.5v7"/><rect class="dot" x="8.6" y="16.4" width="2.4" height="2.4"/></svg></button></p>
    </div>
  </section>

  <section class="rite" id="rite" role="dialog" aria-modal="true" aria-labelledby="rite-title" hidden>
    <canvas class="rite-canvas" aria-hidden="true"></canvas>
    <div class="rite-tools">
      <button class="rite-mute" type="button" aria-label="靜音" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="cross" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
      <button class="rite-leave" type="button">返回</button>
    </div>

    <div class="rite-prep">
      <svg class="rite-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="12" r="5.4" stroke-dasharray="1.2 2.2"/><path d="M12 1.8v3M12 19.2v3M1.8 12h3M19.2 12h3M4.8 4.8l2.1 2.1M17.1 17.1l2.1 2.1M4.8 19.2l2.1-2.1M17.1 6.9l2.1-2.1"/></svg>
      <h2 id="rite-title">十方迴向</h2>
      <p class="rite-plan"></p>
      <div class="rite-actions">
        <button type="button" class="primary" data-act="start">開始</button>
        <button type="button" data-act="back">返回</button>
      </div>
      <p class="rite-note"></p>
    </div>

    <div class="rite-stage">
      <p class="rite-word" lang="sa"></p>
      <ol class="rite-ring" lang="sa" aria-hidden="true"></ol>
      <p class="rite-line" aria-live="polite"></p>
      <button class="rite-fish" type="button" aria-label="敲木魚" disabled><svg viewBox="0 0 96 80" aria-hidden="true"><path class="body" d="M48 12c-21 0-36 13-36 29s15 27 36 27 36-11 36-27c0-6-2-11-6-15"/><path class="body" d="M78 26c-3-4-8-7-13-9"/><path d="M24 44c8 6 40 6 48 0"/><circle cx="66" cy="31" r="2.6"/><path class="fine" d="M30 30c3-3 7-4 11-4M36 56c4 2 9 3 14 3"/></svg><span class="ripple"></span></button>
      <p class="rite-hint">輕敲木魚</p>
    </div>

    <div class="rite-done">
      <h2 class="rite-done-title"></h2>
      <div class="rite-done-lines"></div>
      <figure class="rite-scroll">
        <img alt="百願經卷：本次迴向的所有心願，直排成一幅文字經卷">
        <figcaption class="rite-scroll-msg" aria-live="polite"></figcaption>
        <button type="button" class="rite-retry" hidden>再試一次</button>
      </figure>
      <p class="rite-privacy"></p>
      <div class="rite-actions">
        <button type="button" data-act="save">儲存圖片</button>
        <button type="button" data-act="share">分享</button>
        <button type="button" class="primary" data-act="finish">禮成</button>
      </div>
    </div>

    <div class="rite-history">
      <h2>歷次迴向</h2>
      <ol></ol>
      <div class="rite-actions"><button type="button" data-act="close">返回</button></div>
    </div>
  </section>

  <div class="viewer" id="viewer" hidden>
    <img alt="祈福圖像">
    <p>長按圖片即可儲存</p>
  </div>

  <div class="flame" id="flame" aria-hidden="true"></div>
  <div class="veil" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
