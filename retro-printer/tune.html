<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>調參</title>
<link rel="stylesheet" href="src/ui/tokens.css">
<link rel="stylesheet" href="src/ui/layout.css">
<link rel="stylesheet" href="src/ui/panel.css">
<link rel="stylesheet" href="src/stations/workbench/workbench.css">
<style>
  /* 開發用頁面：網站不會連到這一頁 */
  body { padding-right: 300px; }
  .app { max-width: 1100px; gap: 64px; padding: 48px 40px; }
  #tune {
    position: fixed; top: 0; right: 0; bottom: 0; width: 300px; overflow-y: auto;
    padding: 32px 28px 48px; background: var(--paper); border-left: 1px solid var(--line);
    font-size: 12px;
  }
  #tune header h1 { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .14em; color: var(--mute); }
  #tune header p { margin: 0 0 20px; line-height: 1.6; color: var(--mute); }
  #tune .row-btns, #tune .media { display: flex; gap: 18px; margin-bottom: 12px; }
  #tune .media { padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  #tune .text { font-size: 12px; }
  #tune .text.on { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
  #tune section { padding: 18px 0 6px; border-bottom: 1px solid var(--line); }
  #tune h2 { margin: 0 0 12px; font-size: 11px; font-weight: 500; letter-spacing: .12em; color: var(--mute); }
  #tune label { display: grid; grid-template-columns: 1fr auto; row-gap: 2px; margin-bottom: 14px; }
  #tune label .name { color: var(--ink); }
  #tune label output { font-variant-numeric: tabular-nums; color: var(--mute); }
  #tune label.dirty output { color: var(--ink); font-weight: 600; }
  #tune input[type=range] { grid-column: 1 / -1; width: 100%; margin: 4px 0 0; accent-color: var(--ink); }
  #tune footer { display: grid; gap: 14px; padding-top: 24px; }
  #tune footer .primary { height: 44px; font-size: 12px; }
  #tune .note { margin: 0; color: var(--mute); white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
  @media (max-width: 900px) {
    body { padding-right: 0; }
    #tune { position: static; width: auto; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<main class="app" id="app"></main>
<aside id="tune"></aside>
<script type="module" src="src/dev/tune.js"></script>
</body>
</html>
