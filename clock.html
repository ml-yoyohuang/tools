<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>精準時鐘</title>
  <meta name="theme-color" content="#080808">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="精準時鐘">
  <link rel="manifest" href="./clock-manifest.json">
  <link rel="apple-touch-icon" href="./clock-icon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080808;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      user-select: none;
    }

    .nav-back {
      position: fixed;
      top: 20px;
      left: 24px;
      text-decoration: none;
      color: #555;
      font-size: 13px;
      font-weight: 600;
      transition: color 0.2s;
      z-index: 10;
    }
    .nav-back:hover { color: #aaa; }

    /* 主時間 */
    .time-main {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: clamp(72px, 18vw, 200px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #fff;
      text-align: center;
    }

    .time-main .colon {
      color: #444;
      animation: blink 1s step-start infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    .time-ms {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: clamp(24px, 5vw, 56px);
      font-weight: 400;
      color: #444;
      text-align: center;
      margin-top: 8px;
      letter-spacing: 0.05em;
    }

    .time-ms .ms-val {
      color: #888;
      min-width: 3ch;
      display: inline-block;
    }

    /* 色塊列 */
    .blocks-wrap {
      margin-top: clamp(24px, 5vw, 48px);
      width: 100%;
      max-width: 900px;
    }

    .blocks-label {
      display: flex;
      justify-content: space-between;
      padding: 0 2px;
      margin-bottom: 10px;
    }

    .block-label-item {
      flex: 1;
      text-align: center;
      font-size: clamp(11px, 1.8vw, 16px);
      font-weight: 700;
      color: #333;
      font-family: 'SF Mono', 'Fira Code', monospace;
      letter-spacing: 0;
    }

    .blocks {
      display: flex;
      gap: clamp(4px, 1vw, 10px);
      height: clamp(60px, 12vw, 120px);
    }

    .block {
      flex: 1;
      border-radius: 8px;
      border: 2px solid #1a1a1a;
      background: #111;
      transition: background 0.05s, border-color 0.05s, box-shadow 0.05s;
      position: relative;
    }

    /* 已過去的 tenth（本秒已走過） */
    .block.past {
      background: #0d2b1a;
      border-color: #1a4a2e;
    }

    /* 當前 tenth */
    .block.active {
      background: #00ff88;
      border-color: #00ff88;
      box-shadow: 0 0 24px #00ff8866, 0 0 60px #00ff8833;
    }

    /* 接近換秒（第 8、9 塊） */
    .block.active.warn {
      background: #ffaa00;
      border-color: #ffaa00;
      box-shadow: 0 0 24px #ffaa0066, 0 0 60px #ffaa0033;
    }
    .block.past.warn-past {
      background: #2b1e00;
      border-color: #4a3300;
    }

    /* 換秒閃光 */
    @keyframes tick-flash {
      0%   { background: #ffffff; box-shadow: 0 0 60px #fff, 0 0 120px #fff8; }
      100% { background: #00ff88; box-shadow: 0 0 24px #00ff8866, 0 0 60px #00ff8833; }
    }
    .block.flash {
      animation: tick-flash 0.15s ease-out forwards;
    }

    /* 懸浮視窗按鈕 */
    .btn-pip {
      position: fixed;
      bottom: 28px;
      right: 28px;
      padding: 10px 20px;
      background: #1a1a1a;
      color: #aaa;
      border: 1.5px solid #2a2a2a;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      z-index: 10;
    }
    .btn-pip:hover { background: #222; color: #fff; border-color: #555; }
    .btn-pip.active { background: #0a1f14; color: #00ff88; border-color: #00ff8844; }
    .btn-pip.unsupported { display: none; }

    /* 進度條（秒內進度） */
    .progress-wrap {
      margin-top: clamp(16px, 3vw, 28px);
      width: 100%;
      max-width: 900px;
    }

    .progress-bar-bg {
      height: 6px;
      background: #1a1a1a;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00ff88, #ffaa00);
      border-radius: 99px;
    }

    /* 對時狀態 */
    .sync-status {
      margin-top: 12px;
      font-size: 12px;
      color: #444;
      letter-spacing: 0.04em;
      min-height: 18px;
      transition: color 0.3s;
    }
    .sync-status.ok   { color: #00ff88; }
    .sync-status.warn { color: #ffaa00; }
    .sync-status.fail { color: #555; }

    /* 警語 */
    .sync-warning {
      margin-top: 8px;
      font-size: 12px;
      color: #555;
      letter-spacing: 0.04em;
      line-height: 1.4;
    }

    .sw-update-toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      width: min(92vw, 520px);
      background: #131313;
      border: 1px solid #2b2b2b;
      color: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 20;
    }

    .sw-update-toast.open {
      display: flex;
    }

    .sw-update-msg {
      font-size: 13px;
      line-height: 1.35;
      color: #d3d3d3;
    }

    .sw-update-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .sw-btn {
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .sw-btn.later {
      background: #242424;
      color: #ddd;
    }

    .sw-btn.update {
      background: #00ff88;
      color: #062414;
    }
  </style>
</head>
<body>
  <a href="index.html" class="nav-back">← 返回首頁</a>

  <div class="time-main" id="time-main">
    <span id="hh">00</span><span class="colon">:</span><span id="mm">00</span><span class="colon">:</span><span id="ss">00</span>
  </div>

  <div class="time-ms">
    .<span class="ms-val" id="ms">000</span>
  </div>

  <div class="blocks-wrap">
    <div class="blocks-label" id="blocks-label"></div>
    <div class="blocks" id="blocks"></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <div class="sync-status" id="sync-status"></div>
    <div class="sync-warning">注意：本時鐘已於載入時與伺服器同步。受限於網路及設備精度，顯示時間可能存在 ±10∼30 ms 誤差。</div>
  </div>

  <button class="btn-pip" id="btn-pip">⧉ 懸浮視窗</button>

  <div class="sw-update-toast" id="swUpdateToast" role="status" aria-live="polite">
    <div class="sw-update-msg">偵測到新版本，建議立即更新以使用最新修正。</div>
    <div class="sw-update-actions">
      <button type="button" class="sw-btn later" id="swLaterBtn">稍後</button>
      <button type="button" class="sw-btn update" id="swUpdateBtn">立即更新</button>
    </div>
  </div>

  <script>
    const hhEl   = document.getElementById('hh')
    const mmEl   = document.getElementById('mm')
    const ssEl   = document.getElementById('ss')
    const msEl   = document.getElementById('ms')
    const blocksEl = document.getElementById('blocks')
    const labelsEl = document.getElementById('blocks-label')
    const fillEl = document.getElementById('progress-fill')
    const swUpdateToast = document.getElementById('swUpdateToast')
    const swLaterBtn = document.getElementById('swLaterBtn')
    const swUpdateBtn = document.getElementById('swUpdateBtn')

    const TOTAL = 10
    const blocks = []
    let prevTenth = -1
    let prevSec   = -1
    let waitingServiceWorker = null
    let hasShownSwUpdateToast = false
    let shouldReloadAfterSwUpdate = false

    // 建立色塊與標籤
    for (let i = 0; i < TOTAL; i++) {
      const label = document.createElement('div')
      label.className = 'block-label-item'
      label.textContent = '.' + ((i + 1) % 10)
      labelsEl.appendChild(label)

      const b = document.createElement('div')
      b.className = 'block'
      blocksEl.appendChild(b)
      blocks.push(b)
    }

    function pad2(n) { return String(n).padStart(2, '0') }
    function pad3(n) { return String(n).padStart(3, '0') }

    let timeOffset = 0
    const syncEl = document.getElementById('sync-status')

    function showSyncResult(offset) {
      const abs = Math.abs(offset)
      if (abs < 1000) {
        syncEl.className = 'sync-status ok'
        syncEl.textContent = '✓ 裝置時間正常（誤差 < 1 秒）'
      } else {
        const secs = (abs / 1000).toFixed(1)
        const dir  = offset > 0 ? '慢' : '快'
        syncEl.className = 'sync-status warn'
        syncEl.textContent = `⚠ 裝置比標準時間${dir}約 ${secs} 秒`
      }
    }

    function showSyncFail() {
      syncEl.className = 'sync-status fail'
      syncEl.textContent = '無法對時，顯示裝置時間'
    }

    async function syncTime() {
      // 注意：本時鐘已於載入時與伺服器同步一次。受限於網路延遲及設備時鐘精度，
      // 顯示時間與絕對真實時間可能存在 ±10∼30 ms 的誤差。長時間開啟後，誤差可能逐漸累積。
      syncEl.className = 'sync-status'
      syncEl.textContent = '同步中...'
      const TRIES = 5, KEEP = 3
      const results = []
      for (let i = 0; i < TRIES; i++) {
        const t0 = Date.now()
        try {
          const res = await fetch(`./clock.html?timesync=${Date.now()}`, {
            method: 'HEAD', cache: 'no-store'
          })
          const t1 = Date.now()
          const dateHeader = res.headers.get('Date')
          if (!dateHeader) continue
          const serverMs = new Date(dateHeader).getTime()
          if (isNaN(serverMs)) continue
          results.push({ offset: (serverMs + 500) - (t0 + t1) / 2, rtt: t1 - t0 })
        } catch (_) {}
      }
      if (!results.length) { showSyncFail(); return }
      results.sort((a, b) => a.rtt - b.rtt)
      const best = results.slice(0, KEEP)
      timeOffset = Math.round(best.reduce((s, r) => s + r.offset, 0) / best.length)
      showSyncResult(timeOffset)
    }

    function tick() {
      const now    = new Date(Date.now() + timeOffset)
      const h      = now.getHours()
      const m      = now.getMinutes()
      const s      = now.getSeconds()
      const ms     = now.getMilliseconds()
      const tenth  = Math.floor(ms / 100)
      const pct    = ms / 1000

      hhEl.textContent = pad2(h)
      mmEl.textContent = pad2(m)
      ssEl.textContent = pad2(s)
      msEl.textContent = pad3(ms)
      fillEl.style.width = (pct * 100).toFixed(2) + '%'

      // 換秒 → 閃光第 0 塊
      const secChanged = s !== prevSec
      prevSec = s

      const displayActive = (tenth + 9) % 10

      for (let i = 0; i < TOTAL; i++) {
        const b = blocks[i]
        const isWarnZone = i >= 8

        if (i === displayActive) {
          b.className = 'block active' + (isWarnZone ? ' warn' : '')
          if (secChanged && i === 9) {
            b.classList.add('flash')
            b.addEventListener('animationend', () => b.classList.remove('flash'), { once: true })
          }
        } else if (i < displayActive) {
          b.className = 'block past' + (isWarnZone ? ' warn-past' : '')
        } else {
          b.className = 'block'
        }
      }

      prevTenth = tenth
      requestAnimationFrame(tick)
    }

    requestAnimationFrame(tick)
    syncTime()

    function showSwUpdateToast(worker) {
      if (hasShownSwUpdateToast) return
      waitingServiceWorker = worker
      hasShownSwUpdateToast = true
      swUpdateToast.classList.add('open')
    }

    function hideSwUpdateToast() {
      swUpdateToast.classList.remove('open')
    }

    swLaterBtn.addEventListener('click', hideSwUpdateToast)
    swUpdateBtn.addEventListener('click', () => {
      if (waitingServiceWorker) {
        shouldReloadAfterSwUpdate = true
        waitingServiceWorker.postMessage({ type: 'SKIP_WAITING' })
      }
    })

    if ('serviceWorker' in navigator) {
      let refreshing = false

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!shouldReloadAfterSwUpdate || refreshing) return
        refreshing = true
        window.location.reload()
      })

      navigator.serviceWorker.register('./sw-clock.js').then(registration => {
        if (registration.waiting) {
          showSwUpdateToast(registration.waiting)
        }

        registration.addEventListener('updatefound', () => {
          const newWorker = registration.installing
          if (!newWorker) return

          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              showSwUpdateToast(newWorker)
            }
          })
        })
      }).catch(error => {
        console.error('Service Worker registration failed:', error)
      })
    }

    // --- 懸浮視窗（Document Picture-in-Picture）---
    const btnPip = document.getElementById('btn-pip')

    if (!('documentPictureInPicture' in window)) {
      btnPip.classList.add('unsupported')
    }

    btnPip.addEventListener('click', async () => {
      // 已開啟則關閉
      if (documentPictureInPicture.window) {
        documentPictureInPicture.window.close()
        return
      }

      const pip = await documentPictureInPicture.requestWindow({ width: 460, height: 210 })

      // 樣式
      const style = pip.document.createElement('style')
      style.textContent = `
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          background: #080808; color: #fff;
          font-family: 'SF Mono','Fira Code','Consolas',monospace;
          display: flex; flex-direction: column;
          align-items: center; justify-content: center;
          height: 100vh; padding: 14px; user-select: none;
        }
        .p-time {
          width: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 0;
          font-size: min(58px, calc((100vw - 28px) / 8.2));
          font-weight: 700;
          letter-spacing: -0.03em;
          line-height: 1;
          white-space: nowrap;
          overflow: hidden;
        }
        .p-unit {
          display: inline-block;
          width: 2ch;
          text-align: center;
        }
        .p-sep {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 0.6ch;
          color: #444;
          animation: blink 1s step-start infinite;
        }
        .p-ms-line {
          width: 100%;
          text-align: center;
          font-size: min(22px, calc((100vw - 28px) / 16));
          color: #888;
          margin-top: 4px;
          white-space: nowrap;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
        @keyframes tick-flash {
          0%   { background:#fff; box-shadow:0 0 20px #fff; }
          100% { background:#ffaa00; box-shadow:0 0 8px #ffaa0066; }
        }
      `
      pip.document.head.appendChild(style)

      // 結構
      pip.document.body.innerHTML = `
        <div class="p-time">
          <span id="p-hh" class="p-unit">00</span><span class="p-sep">:</span><span id="p-mm" class="p-unit">00</span><span class="p-sep">:</span><span id="p-ss" class="p-unit">00</span>
        </div>
        <div class="p-ms-line">.<span id="p-ms">000</span></div>
        <div id="p-blocks" style="display:flex;gap:5px;margin-top:10px;width:100%;height:26px;"></div>
        <div style="width:100%;height:4px;background:#1a1a1a;border-radius:99px;margin-top:8px;overflow:hidden;">
          <div id="p-fill" style="height:100%;background:linear-gradient(90deg,#00ff88,#ffaa00);border-radius:99px;width:0%;"></div>
        </div>
      `

      // 色塊
      const pipBlocksEl = pip.document.getElementById('p-blocks')
      const pipBlocks = []
      for (let i = 0; i < 10; i++) {
        const b = pip.document.createElement('div')
        b.style.cssText = 'flex:1;border-radius:4px;border:1.5px solid #1a1a1a;background:#111;'
        pipBlocksEl.appendChild(b)
        pipBlocks.push(b)
      }

      const pHh   = pip.document.getElementById('p-hh')
      const pMm   = pip.document.getElementById('p-mm')
      const pSs   = pip.document.getElementById('p-ss')
      const pMs   = pip.document.getElementById('p-ms')
      const pFill = pip.document.getElementById('p-fill')
      let pipPrevSec = -1

      function pipTick() {
        if (!documentPictureInPicture.window) return
        const now = new Date(Date.now() + timeOffset)
        const h = now.getHours(), m = now.getMinutes()
        const s = now.getSeconds(), ms = now.getMilliseconds()
        const displayActive = (Math.floor(ms / 100) + 9) % 10
        const secChanged = s !== pipPrevSec
        pipPrevSec = s

        pHh.textContent = pad2(h); pMm.textContent = pad2(m)
        pSs.textContent = pad2(s); pMs.textContent = pad3(ms)
        pFill.style.width = (ms / 10).toFixed(2) + '%'

        for (let i = 0; i < 10; i++) {
          const b = pipBlocks[i]
          const warn = i >= 8
          if (i === displayActive) {
            b.style.background   = warn ? '#ffaa00' : '#00ff88'
            b.style.borderColor  = warn ? '#ffaa00' : '#00ff88'
            b.style.boxShadow    = warn ? '0 0 8px #ffaa0066' : '0 0 8px #00ff8866'
            if (secChanged && i === 9) {
              b.style.animation = 'tick-flash 0.15s ease-out forwards'
              b.addEventListener('animationend', () => { b.style.animation = '' }, { once: true })
            }
          } else if (i < displayActive) {
            b.style.background  = warn ? '#2b1e00' : '#0d2b1a'
            b.style.borderColor = warn ? '#4a3300' : '#1a4a2e'
            b.style.boxShadow   = ''
          } else {
            b.style.background  = '#111'
            b.style.borderColor = '#1a1a1a'
            b.style.boxShadow   = ''
          }
        }
        pip.requestAnimationFrame(pipTick)
      }
      pip.requestAnimationFrame(pipTick)

      btnPip.textContent = '⧉ 關閉懸浮'
      btnPip.classList.add('active')
      pip.addEventListener('pagehide', () => {
        btnPip.textContent = '⧉ 懸浮視窗'
        btnPip.classList.remove('active')
      })
    })
  </script>
</body>
</html>
