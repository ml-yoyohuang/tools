<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e8e4dc">
<title>Stamp</title>
<script>
  /* 版本號：每次推版都要改，讓手機一定讀到新檔案（GitHub Pages 會讓瀏覽器快取 10 分鐘）
     CSS 與所有 JS 模組都會加上 ?v=版本號 */
  window.STAMP_V = '17';
  (function () {
    var V = window.STAMP_V, base = new URL('js/', location.href).href, map = { imports: {} };
    ['main', 'config', 'copy', 'util', 'art', 'print', 'cardface', 'storage', 'attendant', 'stamping', 'opening', 'arrival', 'finale', 'dragstamp', 'postcard', 'stamps']
      .forEach(function (m) { map.imports[base + m + '.js'] = base + m + '.js?v=' + V; });
    var s = document.createElement('script'); s.type = 'importmap'; s.textContent = JSON.stringify(map);
    document.currentScript.after(s);
    document.write('<link rel="stylesheet" href="css/app.css?v=' + V + '">');
  })();
</script>
</head>
<body>
<canvas id="stage"></canvas>

<div id="opening" hidden></div>
<div id="arrival" hidden></div>
<div id="finale" hidden></div>
<div id="postcard" hidden></div>

<div id="top">
  <div id="host"></div>
  <div id="bubble"><span id="line"></span>
    <svg id="more" viewBox="0 0 10 10" hidden><path d="M3 1.5 6.8 5 3 8.5" fill="none" stroke="#24221f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <button id="stack" aria-label="new card">
    <svg viewBox="0 0 40 40" width="40" height="40">
      <rect x="11" y="9" width="20" height="15" rx="1.6" fill="#f7f4ee" stroke="#24221f" stroke-width="1.1" transform="rotate(-7 21 16)"/>
      <rect x="10" y="13" width="20" height="15" rx="1.6" fill="#f7f4ee" stroke="#24221f" stroke-width="1.1" transform="rotate(4 20 20)"/>
      <rect x="9" y="17" width="20" height="15" rx="1.6" fill="#fbfaf6" stroke="#24221f" stroke-width="1.1"/>
    </svg>
  </button>
</div>

<canvas id="loupe"></canvas>
<div id="dev"></div>

<script type="module">import './js/main.js';</script>
</body>
</html>
